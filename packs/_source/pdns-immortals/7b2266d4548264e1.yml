  description:
    value: >-
      <p><strong>Ações: ⬢⬢</strong></p><p>Ao gastar 4 PQ, a criatura libera constantemente uma nuvem de esporos em uma
      emanação de 10 metros de raio ao seu redor, causando 1d4 de dano de Veneno por ND, até um máximo de 10d4. Todas as
      criaturas que iniciarem o turno dentro da área devem realizar uma Salvaguarda de Vontade, sofrendo todo o dano se
      falharem ou metade se obtiverem sucesso. Uma criatura que falhar recebe a condição “Envenenado”.</p>
