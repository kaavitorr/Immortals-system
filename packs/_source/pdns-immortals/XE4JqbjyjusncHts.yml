name: Íncubo
type: archetype
folder: 29e85c5a0e7a7147
system:
  description:
    value: >-
      <p>Aproxima-se sob disfarce ou ocultação e enfraquece a vítima com medo, hipnose e contato físico. Prefere alvos
      isolados, que possa paralisar e drenar.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Alma −8 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 + Sab).</p><p><strong>Perícias:</strong>
      Proficiências: Furtividade, Intimidação, Enganação e Sobrenatural.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Presença e Fortitude.</p><p><strong>Aspectos:</strong> Algoz Invisível, Aura do Medo, Hipnose
      Passiva, Sussurro Perturbador, Criatura sem Alma, Mente Singular, Silenciosa, Presença Aterradora, Fanático,
      Analisar Padrões.</p><p><strong>Habilidades:</strong> Medo Instilado, Beijo Tenebroso, Dreno da Alma, Hipnotizar,
      Grito Psíquico, Ilusão Menor, Passo das Sombras, Onda de Charme, Roubo de Nome, Fingir-se de
      Objeto.</p><p><strong>Reações:</strong> Toque Paralisante, Sussurro Reativo, Esquiva Rápida.</p>
