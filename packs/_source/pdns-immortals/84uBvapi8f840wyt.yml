system:
  description:
    value: >-
      <p>Sustenta a linha de frente com proteção reforçada e resistência a deslocamentos. Intercepta projéteis e ataques
      para impedir o avanço inimigo e resguardar aliados.</p><p><strong>Resistência por ND:</strong> Físicos
      +2</p><p><strong>Vulnerabilidade:</strong> Psíquico −8</p><p><strong>Deslocamento:</strong> Caminhada: 10 m
      (fixo)</p><p><strong>Armaduras:</strong> Placas Pesadas (16 + For).</p><p><strong>Perícias:</strong>
      Proficiências: Atletismo, Intimidação, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Vontade e Fortitude.</p><p><strong>Aspectos:</strong> Estabilidade, Pele Grossa, Corpo Resistente,
      Implacável, Fanático, Vigoroso, Corpo Robusto, Temperamento Frio, Reativo,
      Intimidadora.</p><p><strong>Habilidades:</strong> Manter Firme, Defesa Robusta, Enrijecer Músculos, Escudo Humano,
      Agarrar Projétil, Golpe Aterrador, Onda de Choque, Contra-Golpe, Rugido Terrível, Investida
      Derrubadora.</p><p><strong>Reações:</strong> Escudo Reativo, Endurecer, Bloqueio.</p>
