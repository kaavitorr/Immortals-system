    value: >-
      <p><strong>Ações: ⬢⬢⬢</strong></p><p>A criatura pode gastar 5 PQ para escolher um lugar ao alcance de até 10
      metros + 2 metros por ND dela e liberar nesse local um pilar de chamas com raio de 3 metros + 1 metro por ND,
      causando metade do ND da criatura em d6, arredondada para cima. Todas as criaturas dentro da área da técnica devem
      realizar uma Salvaguarda de Reflexo, sofrendo todo o dano como dano de Fogo se falharem ou metade se obtiverem
      sucesso.</p>
