name: Drenador (vampírico)
type: archetype
folder: 26a0e683ac977c63
system:
  description:
    value: >-
      <p>Drena a vitalidade das vítimas para sustentar o próprio corpo. Combina mordidas e contato próximo com hipnose,
      disfarces e transformações para controlar a presa.</p><p><strong>Resistência por ND:</strong> Físicos +1 | Veneno
      +1</p><p><strong>Vulnerabilidade:</strong> Fogo −8 | Alma −6</p><p><strong>Deslocamento:</strong> +1 até um máximo
      de 25</p><p><strong>Armaduras:</strong> Couro Pesado (10 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Percepção, Intimidação e Sobrenatural.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Reflexo.</p><p><strong>Aspectos:</strong> Sede de Sangue, Fome Insaciável, Agarrador, Algoz Invisível, Silenciosa,
      Camuflagem, Faro Aguçado, Reflexos Aguçados, Hipnose Passiva, Fanático.</p><p><strong>Habilidades:</strong>
      Drenagem de Sangue, Dreno da Alma, Beijo Tenebroso, Mordida Voraz, Bote Sônico, Nuvem de Morcegos, Transformação
      Animal, Mordida Transformadora, Transferir Praga, Fuga Escorregadia.</p><p><strong>Reações:</strong> Dreno
      Reativo, Nuvem de Morcegos, Esquiva Rápida.</p>
