system:
  description:
    value: >-
      <p>Isola um alvo e prepara um golpe preciso a partir da furtividade. Usa marcas, disfarces e mobilidade para
      explorar vulnerabilidades e escapar após o ataque.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6</p><p><strong>Deslocamento:</strong> Caminhada: 10 m
      (fixo)</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Furtividade,
      Enganação, Percepção e Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Assassinar, Emboscador, Ataque Surpresa, Silenciosa, Golpe Preciso,
      Reflexos Aguçados, Algoz Invisível, Analisar Padrões, Camuflagem, Fanático.</p><p><strong>Habilidades:</strong>
      Golpe Letal, Apunhalar, Marca do Assassino, Passo das Sombras, Esquiva Rápida, Tiro Preciso, Fuga Escorregadia,
      Bote Sônico, Ilusão Menor, Desarme.</p><p><strong>Reações:</strong> Golpe nas Sombras, Esquiva Rápida, Fuga
      Silenciosa.</p>
