system:
  description:
    value: >-
      <p>Combina ataques de várias cabeças em um ritmo difícil de antecipar. Usa golpes simultâneos, vozes e movimentos
      imprevisíveis para desorganizar a defesa inimiga.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −8 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Enganação, Percepção, Furtividade e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Analisar Padrões, Reativo, Reflexos Aguçados, Agressivo, Descuidado,
      Tática de Bando, Sussurro Perturbador, Emboscador, Aura do Medo, Fanático.</p><p><strong>Habilidades:</strong>
      Golpe Duplo, Ataque em Cadeia, Imitar Voz, Medo Instilado, Grito Estridente, Bote Sônico, Desarme, Contra-Golpe,
      Marca do Assassino, Esquiva Rápida.</p><p><strong>Reações:</strong> Golpe Imprevisível, Contra-Golpe, Esquiva
      Rápida.</p>
