system:
  description:
    value: >-
      <p>Ocupa posições importantes e dificulta o avanço inimigo. Reforça a própria defesa, intercepta ataques e
      sustenta a linha de frente junto aos aliados.</p><p><strong>Resistência por ND:</strong> Contundente +2 | Cortante
      +1 | Perfurante +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −8 | Ácido −6 | Frio
      −6</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong> Placas Pesadas
      (16 + For).</p><p><strong>Perícias:</strong> Proficiências: Atletismo, Intimidação, Percepção e
      Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Estabilidade, Corpo Inerte, Pele Grossa, Escamas de Aço, Implacável,
      Vigoroso, Autossuficiente, Fanático, Vontade Metálica, Temperamento Frio.</p><p><strong>Habilidades:</strong>
      Manter Firme, Defesa Robusta, Enrijecer Músculos, Couraça de Metal, Escudo Humano, Golpe Aterrador, Onda de
      Choque, Rugido Terrível, Investida Derrubadora, Agarrar Projétil.</p><p><strong>Reações:</strong> Endurecer,
      Ataque Reativo, Agarrar Projétil.</p>
