system:
  description:
    value: >-
      <p>Produz vibrações e ondas de impacto para atingir os inimigos e abalar o terreno. Combina golpes físicos com
      estilhaços e recomposição para manter a pressão.</p><p><strong>Resistência por ND:</strong> Físicos
      +2</p><p><strong>Vulnerabilidade:</strong> Contundente −10 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1
      até um máximo de 24</p><p><strong>Armaduras:</strong> Placas Cristalizadas (12 +
      For).</p><p><strong>Perícias:</strong> Proficiências: Percepção, Sobrenatural, Sobrevivência e
      Intimidação.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Corpo Inerte, Pele Grossa, Escamas de Aço, Autossuficiente, Mente
      Inexistente, Temperamento Frio, Vigoroso, Implacável, Tremoresense, Fanático.</p><p><strong>Habilidades:</strong>
      Ressonância, Estilhaçar, Onda de Choque, Enrijecer Músculos, Agarrar Projétil, Golpe Esmagador, Manter Firme,
      Terremoto, Contra-Golpe, Lançar Rocha.</p><p><strong>Reações:</strong> Ressonância Reativa, Estilhaço Reativo,
      Enrijecer Músculos.</p>
