system:
  description:
    value: >-
      <p>Agarra e devora suas presas para recuperar forças durante o combate. Prefere a curta distância, onde pode
      morder, drenar sangue e manter o alvo preso.</p><p><strong>Resistência por ND:</strong> Contundente +1 | Veneno
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6 | Fogo −6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Musculatura Densa (10 + Con).</p><p><strong>Perícias:</strong>
      Proficiências: Sobrevivência, Percepção, Atletismo e Intimidação.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Vontade e Fortitude.</p><p><strong>Aspectos:</strong> Carnívoro Voraz, Fome Insaciável, Frenesi de
      Sangue, Corpo Robusto, Sede de Sangue, Faro Aguçado, Agarrador, Implacável, Descuidado,
      Vigoroso.</p><p><strong>Habilidades:</strong> Mordida Voraz, Digestão Rápida, Drenagem de Sangue, Bote Sônico,
      Golpe Esmagador, Enrolar, Abraço Esmagador, Investida, Regenerar Membro, Fuga
      Escorregadia.</p><p><strong>Reações:</strong> Mordida Reativa, Absorção Reativa, Reflexo.</p>
