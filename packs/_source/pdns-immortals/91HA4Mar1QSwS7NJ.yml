system:
  description:
    value: >-
      <p>Ataca a partir de pontos elevados, concentrando peso e impulso em golpes de mergulho. Usa resistência e
      contra-ataques para sustentar o combate após a queda.</p><p><strong>Resistência por ND:</strong> Físicos
      +2</p><p><strong>Vulnerabilidade:</strong> Psíquico −6</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      24</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Percepção,
      Atletismo, Intimidação e Furtividade.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Voo Superior, Sobrevoo, Visão Aguçada, Pele Grossa, Implacável,
      Fanático, Estabilidade, Temperamento Frio, Mente Inexistente, Reativo.</p><p><strong>Habilidades:</strong> Ataque
      de Mergulho, Bote Sônico, Golpe Esmagador, Investida Derrubadora, Agarrar Projétil, Enrijecer Músculos, Manter
      Firme, Onda de Choque, Contra-Golpe, Rugido Terrível.</p><p><strong>Reações:</strong> Ataque de Mergulho, Agarrar
      Projétil, Endurecer.</p>
