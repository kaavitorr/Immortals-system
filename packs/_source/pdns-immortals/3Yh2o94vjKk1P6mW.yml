system:
  description:
    value: >-
      <p>Avança em grupo e transforma a corrida do bando em uma sequência de atropelamentos. Usa investidas e ondas de
      impacto para derrubar e dispersar os inimigos.</p><p><strong>Resistência por ND:</strong> Físicos +1 | Frio
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6 | Fogo −6 · Mov +1 |
      5/ND</p><p><strong>Deslocamento:</strong> +1 até um máximo de 24</p><p><strong>Armaduras:</strong>
      Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Percepção, Sobrevivência, Atletismo e
      Intimidação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Tática de Bando, Vigoroso, Corpo Robusto, Aura do Medo, Fanático,
      Descuidado, Reativo, Estabilidade, Implacável, Sentidos Aguçados.</p><p><strong>Habilidades:</strong> Debandada,
      Investida Derrubadora, Onda de Choque, Terremoto, Rugido Terrível, Grito de Guerra, Impacto Atordoante, Golpe
      Aterrador, Investida, Esquiva Rápida.</p><p><strong>Reações:</strong> Debandada Reativa, Alerta, Esquiva
      Rápida.</p>
