system:
  description:
    value: >-
      <p>Escolhe um alvo prioritário e concentra nele sua perseguição e seus golpes. Usa marcas, intimidação e ataques
      decisivos para impedir que escape.</p><p><strong>Resistência por ND:</strong> Físicos +1 | Psíquico
      +1</p><p><strong>Vulnerabilidade:</strong> Alma −6 | Fogo −6</p><p><strong>Deslocamento:</strong> Caminhada: 10 m
      (fixo)</p><p><strong>Armaduras:</strong> Couro Pesado (10 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Investigação, Intimidação, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências:
      Fortitude e Vontade.</p><p><strong>Aspectos:</strong> Implacável, Fanático, Fúria, Ferimento Enfurecedor, Sede de
      Sangue, Presença Aterradora, Analisar Padrões, Agressivo, Descuidado,
      Intimidadora.</p><p><strong>Habilidades:</strong> Marca do Culpado, Perseguição Sem Fim, Golpe Letal, Golpe
      Esmagador, Contra-Golpe, Golpe Duplo, Rugido Terrível, Execução Guardiã, Investida Derrubadora, Medo
      Instilado.</p><p><strong>Reações:</strong> Perseguição Implacável, Contra-Golpe, Golpe Final.</p>
