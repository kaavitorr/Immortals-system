system:
  description:
    value: >-
      <p>Ataca a partir do subsolo e provoca desabamentos para soterrar as presas. Usa túneis, impactos e tremores para
      mudar o terreno e escapar da pressão inimiga.</p><p><strong>Resistência por ND:</strong> Contundente
      +2</p><p><strong>Vulnerabilidade:</strong> Ácido −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Percepção,
      Sobrevivência, Atletismo e Intimidação.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Escavador, Sentido de Tremor, Emboscador, Visão no Escuro, Corpo Inerte,
      Vigoroso, Silenciosa, Implacável, Ataque Surpresa, Pele Grossa.</p><p><strong>Habilidades:</strong> Terremoto,
      Emersão Explosiva, Imersão de Fuga, Investida Subterrânea, Lançar Rocha, Golpe Esmagador, Onda de Choque, Bote
      Letal, Enrijecer Músculos, Debandada.</p><p><strong>Reações:</strong> Desabamento Reativo, Investida Subterrânea,
      Ataque Reativo.</p>
