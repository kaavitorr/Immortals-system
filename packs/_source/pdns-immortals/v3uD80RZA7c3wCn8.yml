system:
  description:
    value: >-
      <p>Prende a presa com garras, tentáculos ou mandíbulas e restringe seus movimentos. Mantém o alvo ao alcance para
      golpeá-lo ou expô-lo aos ataques de aliados.</p><p><strong>Resistência por ND:</strong> Perfurante
      +1</p><p><strong>Vulnerabilidade:</strong> Cortante −8</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Musculatura Densa (10 + Con).</p><p><strong>Perícias:</strong> Proficiências:
      Atletismo, Furtividade, Percepção e Intimidação.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Agarrador, Superfície Adesiva, Implacável, Corpo Inerte, Sentidos
      Aguçados, Algoz Invisível, Caminhante de Superfícies, Agressivo, Mente
      Inexistente.</p><p><strong>Habilidades:</strong> Enrolar, Abraço Esmagador, Investida Derrubadora, Disparo de
      Teia, Imersão de Fuga, Emersão Explosiva, Golpe de Cauda, Chicote de Hifas, Fuga
      Escorregadia.</p><p><strong>Reações:</strong> Contra-Aperto, Agarrar Projétil, Reflexo. e Vontade.</p>
