system:
  description:
    value: >-
      <p>Usa cantos, gritos e vibrações para atingir e desestabilizar inimigos. Combina ataques sonoros com medo,
      encantamentos e apoio ao próprio grupo.</p><p><strong>Resistência por ND:</strong> Psíquico +1 | Elétrico
      +1</p><p><strong>Vulnerabilidade:</strong> Cortante −6 | Veneno −6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Intimidação, Atuação, Percepção e Sobrenatural.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Reflexo.</p><p><strong>Aspectos:</strong> Audição Aguçada, Ecolocalização, Presença Aterradora, Sussurro
      Perturbador, Aura do Medo, Intimidadora, Reflexos Aguçados, Analisar Padrões, Fanático, Corpo
      Inerte.</p><p><strong>Habilidades:</strong> Grito Estridente, Grito Psíquico, Onda de Choque, Ressonância, Rugido
      Terrível, Grito de Guerra, Baforada Elemental, Impacto Atordoante, Medo Instilado, Onda de
      Charme.</p><p><strong>Reações:</strong> Grito Reativo, Contra-Golpe, Onda de Choque.</p>
