system:
  description:
    value: >-
      <p>Pressiona o oponente com força física, investidas e golpes pesados. Responde a ataques com pancadas e
      contragolpes, usando o rugido para intimidar.</p><p><strong>Resistência por ND:</strong> Físicos
      +2</p><p><strong>Vulnerabilidade:</strong> Psíquico −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Musculatura Densa (10 + Con).</p><p><strong>Perícias:</strong>
      Proficiências: Atletismo, Intimidação, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Fortitude e Vontade.</p><p><strong>Aspectos:</strong> Força Descomunal, Intimidadora, Agressivo,
      Corpo Robusto, Ferimento Enfurecedor, Fanático, Descuidado, Vigoroso, Implacável,
      Reativo.</p><p><strong>Habilidades:</strong> Golpe Esmagador, Golpe Giratório, Impacto Atordoante, Investida
      Derrubadora, Rugido Terrível, Lançar Rocha, Enrijecer Músculos, Golpe Duplo, Contra-Golpe, Grito de
      Guerra.</p><p><strong>Reações:</strong> Contra-Golpe, Pancada Reativa, Rugido Terrível.</p>
