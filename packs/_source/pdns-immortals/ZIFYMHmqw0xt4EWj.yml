  description:
    value: >-
      <p>Avança em formação e desfere estocadas coordenadas com os aliados. Sustenta a linha com manobras defensivas,
      desarmes e interceptação de projéteis.</p><p><strong>Resistência por ND:</strong> Perfurante
      +2</p><p><strong>Vulnerabilidade:</strong> Elétrico −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Atletismo, Sobrevivência, Percepção e Coordenação.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Reflexo.</p><p><strong>Aspectos:</strong> Tática de Bando, Anfíbio, Vigoroso, Implacável, Fanático, Golpe Preciso,
      Corpo Resistente, Reativo, Analisar Padrões, Intimidadora.</p><p><strong>Habilidades:</strong> Investida,
      Investida Derrubadora, Golpe Duplo, Desarme, Contra-Golpe, Grito de Guerra, Ordem Tática, Agarrar Projétil,
      Esquiva Rápida, Manter Firme.</p><p><strong>Reações:</strong> Estocada Reativa, Formação Defensiva, Agarrar
      Projétil.</p>
