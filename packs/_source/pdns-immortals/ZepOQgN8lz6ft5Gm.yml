system:
  description:
    value: >-
      <p>Divide-se e produz crias para aumentar sua presença no campo de batalha. Usa vários corpos para cercar a presa
      e manter ataques simultâneos.</p><p><strong>Resistência por ND:</strong> Veneno +1 | Ácido
      +1</p><p><strong>Vulnerabilidade:</strong> Fogo −6 | Psíquico −6 · Mov +1 |
      5/ND</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong>
      Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Sobrevivência, Percepção, Furtividade e
      Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Mente Singular, Vigoroso, Autossuficiente, Tática de Bando,
      Implacável, Fome Insaciável, Corpo Inerte, Fanático, Camuflagem, Morte Falsa.</p><p><strong>Habilidades:</strong>
      Divisão, Invocar Crias, Semear Filhotes, Regenerar Membro, Debandada, Digestão Rápida, Nuvem de Esporos, Armadilha
      de Pólen, Golpe Giratório, Ataque em Cadeia.</p><p><strong>Reações:</strong> Divisão Reativa, Crias Reativas,
      Dispersar.</p>
