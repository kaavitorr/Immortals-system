  description:
    value: >-
      <p>Prioriza esquivas, saltos e fugas rápidas para evitar o confronto direto. Ataca em brechas curtas e muda de
      posição antes que o inimigo consiga cercá-la.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Percepção, Coordenação e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Fortitude.</p><p><strong>Aspectos:</strong> Reflexos Aguçados, Salto Parado, Silenciosa, Visão Aguçada, Morte
      Falsa, Camuflagem, Tremoresense, Analisar Padrões, Descuidado, Audição
      Aguçada.</p><p><strong>Habilidades:</strong> Surto de Velocidade, Salto Mortal, Esquiva Rápida, Fuga Escorregadia,
      Passo das Sombras, Ilusão Menor, Bote Sônico, Golpe Duplo, Perseguição Sem Fim,
      Contra-Golpe.</p><p><strong>Reações:</strong> Esquiva Rápida, Reflexo, Fuga Súbita.</p>
