system:
  description:
    value: >-
      <p>Usa pactos, encantamentos e falsas aparências para manipular os oponentes. Procura conduzi-los a situações
      desfavoráveis e reage com artifícios que preservam sua vantagem.</p><p><strong>Resistência por ND:</strong>
      Psíquico +2</p><p><strong>Vulnerabilidade:</strong> Físicos −6 · Mov +1 |
      5/ND</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong> Armadura
      Psíquica (8 + Sab).</p><p><strong>Perícias:</strong> Proficiências: Persuasão, Enganação, Sobrenatural e
      História.</p><p><strong>Salvaguardas:</strong> Proficiências: Presença e Reflexo.</p><p><strong>Aspectos:</strong>
      Hipnose Passiva, Aura do Medo, Sussurro Perturbador, Presença Aterradora, Analisar Padrões, Voo Superior,
      Sobrevoo, Fanático, Mente Singular, Camuflagem.</p><p><strong>Habilidades:</strong> Onda de Charme, Roubo de Nome,
      Ilusão Menor, Medo Instilado, Beijo Tenebroso, Imitar Voz, Criar Duplicata, Cantiga Hipnótica, Passo das Sombras,
      Transferir Praga.</p><p><strong>Reações:</strong> Cláusula Reativa, Charme Reativo, Esquiva Rápida.</p>
