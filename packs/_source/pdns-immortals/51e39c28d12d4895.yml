  description:
    value: >-
      <p><strong>Ações: ⬢⬢ · Reação</strong></p><p>Quando uma criatura realizar uma jogada de acerto contra essa
      criatura ou se mover em sua direção, ela pode gastar 4 PQ para emitir uma onda de choque em um cone de 15 metros à
      sua frente. Todas as criaturas na área devem realizar uma Salvaguarda de Fortitude para não serem empurradas por
      10 metros. Caso a reação seja usada contra um ataque e as criaturas saiam do alcance dele, o ataque é cancelado, e
      a criatura atacante perde a ação utilizada.</p>
