system:
  description:
    value: >-
      <p>Libera pólen, esporos e estímulos hipnóticos para debilitar as presas. Aproveita sua vulnerabilidade para
      prendê-las com raízes, cipós ou outros membros.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Fogo −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Sobrenatural, Percepção e Enganação.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Camuflagem, Mente Inexistente, Temperamento Frio, Autossuficiente, Corpo
      Inerte, Um Com o Mundo, Agarrador, Absorção Rápida, Silenciosa, Implacável.</p><p><strong>Habilidades:</strong>
      Armadilha de Pólen, Nuvem de Esporos, Onda de Charme, Cantiga Hipnótica, Raízes Prendedoras, Enrolar, Abraço
      Esmagador, Digestão Rápida, Chicote de Cipó, Ilusão Menor.</p><p><strong>Reações:</strong> Pólen Reativo, Sussurro
      Reativo, Enraizar.</p>
