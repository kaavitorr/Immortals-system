system:
  description:
    value: >-
      <p>Escolhe o terreno e aguarda a presa em ocultação. Abre o combate com um golpe de surpresa e usa mobilidade,
      disfarces ou esquivas para recuperar a vantagem.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Furtividade,
      Percepção, Enganação e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Fortitude.</p><p><strong>Aspectos:</strong> Emboscador, Ataque Surpresa, Camuflagem, Silenciosa, Assassinar, Golpe
      Preciso, Algoz Invisível, Analisar Padrões, Faro Aguçado, Visão no Escuro.</p><p><strong>Habilidades:</strong>
      Bote Sônico, Golpe Letal, Apunhalar, Marca do Assassino, Passo das Sombras, Surto de Velocidade, Fingir-se de
      Objeto, Esquiva Rápida, Golpe Duplo, Cuspir Veneno.</p><p><strong>Reações:</strong> Bote Surpresa, Esquiva Rápida,
      Contra-Golpe.</p>
