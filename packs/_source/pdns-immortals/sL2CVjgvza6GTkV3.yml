system:
  description:
    value: >-
      <p>Segue os rastros da presa e escolhe o momento favorável para atacar. Combina perseguição, emboscadas e alertas
      aos aliados para impedir a fuga do alvo.</p><p><strong>Resistência por ND:</strong> Perfurante
      +1</p><p><strong>Vulnerabilidade:</strong> Frio −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Sobrevivência, Percepção, Furtividade e Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Sabedoria e
      Vontade.</p><p><strong>Aspectos:</strong> Faro Aguçado, Tremoresense, Visão Aguçada, Temperamento Frio, Analisar
      Padrões, Emboscador, Implacável, Fanático, Pele Grossa, Vigoroso.</p><p><strong>Habilidades:</strong> Rastrear
      pelo Cheiro, Perseguição Sem Fim, Bote Sônico, Golpe Letal, Enrolar, Investida Derrubadora, Contra-Golpe, Rugido
      Terrível, Regenerar Membro, Esquiva Rápida.</p><p><strong>Reações:</strong> Emboscada Reativa, Contra-Golpe,
      Alerta.</p>
