system:
  description:
    value: >-
      <p>Ao perder metade dos seus Pontos de Vida, essa criatura pode se fingir de morta. No caso de um Espírito
      Amaldiçoado, ela se desfaz parcialmente para simular sua destruição.</p><p>Em seguida, realiza um Teste de
      Atributo de Furtividade com duas vantagens. Em caso de sucesso, seu estado de morte aparente permanece até que ela
      realize um ataque contra outra criatura. O primeiro ataque realizado enquanto estiver nesse estado causa um acerto
      crítico garantido.</p>
