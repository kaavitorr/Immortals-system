  description:
    value: >-
      <p>Controladora que manipula atenção, sentidos e posicionamento aparente para conduzir os inimigos a escolhas
      desfavoráveis.</p><p><strong>Resistência por ND:</strong> Psíquico +2 por
      nível.</p><p><strong>Vulnerabilidade:</strong> Perfurante −8.</p><p><strong>Deslocamento por ND:</strong> Ganho de
      1 m por nível, até o máximo de 25 m.</p><p><strong>Armaduras:</strong> Mantém Couro
      Leve.</p><p><strong>Perícias:</strong> Enganação, Controle de Qi, Atuação e
      Furtividade.</p><p><strong>Salvaguardas:</strong> Vontade, Reflexo e
      Fortitude.</p><p><strong>Habilidades:</strong> Fascínio da Raposa [Nv. 1], Duplicata Errante [Nv. 2], Ecos da Voz
      [Nv. 3], Véu das Formas [Nv. 6], Labirinto de Miragens [Nv. 8], Olhar que Revela [Nv. 10], Cortejo Ilusório [Nv.
      12], Sonho Aprisionador [Nv. 14], Palácio das Mil Miragens [Nv. 15].</p><p><strong>Reações:</strong> Cauda
      Substituta [Nv. 5].</p>
