  description:
    value: >-
      <p>Combatente de grande presença que alterna ataques corporais e manifestações elementais para dominar o campo de
      batalha.</p><p><strong>Resistência por ND:</strong> Dano associado ao elemento Intermediário escolhido +2 por
      nível</p><p><strong>Vulnerabilidade:</strong> Alma −8.</p><p><strong>Deslocamento por ND:</strong> Ganho de 1 m
      por nível, até o máximo de 25 m em cada modalidade existente.</p><p><strong>Armaduras:</strong> Mantém Escamas
      Pesadas.</p><p><strong>Perícias:</strong> Intimidação, Controle de Qi, Atletismo e
      Percepção.</p><p><strong>Salvaguardas:</strong> Vontade, Fortitude e Reflexo.</p><p><strong>Habilidades:</strong>
      Garras Imbuídas [Nv. 1], Rugido do Soberano [Nv. 2], Enlace Dracônico [Nv. 3], Sopro Moldado [Nv. 6], Convergência
      das Afinidades [Nv. 8], Marcas do Domínio [Nv. 10], Corpo do Dragão Ancestral [Nv. 12], Extermínio do Soberano
      Celestial [Nv. 15].</p><p><strong>Reações:</strong> Escamas Vibrantes [Nv. 5], Mandato Elemental [Nv. 14].</p>
