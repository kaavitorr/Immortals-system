system:
  description:
    value: >-
      <p>Reúne criaturas serpentinas aparentadas aos dragões, como dracotes, dracos comuns e dracos tirânicos. Costumam
      viver e caçar em bandos.</p><p>Variações de tamanho e deslocamento:</p><p>Dracote: Tamanho Médio; deslocamento 10
      m.</p><p>Draco: Tamanho Grande; deslocamento 15 m.</p><p>Draco Tirânico: Tamanho Enorme; deslocamento 20
      m.</p><p>Essas criaturas não constituem uma espécie natural neste mundo: são maldições originadas do medo e das
      lendas sobre dracos, geralmente de grau especial.</p><p><strong>Resistência:</strong> Físicos
      +6</p><p><strong>Vulnerabilidade:</strong> Psíquico −3 | Alma −3</p><p><strong>Deslocamento:</strong> Todos:
      Especial</p><p><strong>Armaduras:</strong> Placas Leves (12 + For); tanque: Placas Pesadas (16 +
      For).</p><p><strong>Perícias:</strong> Proficiências: Atletismo, Coordenação, Intimidação, Sobrenatural, Percepção
      Sorte.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e Vontade.</p><p><strong>Aspectos:</strong>
      Voo Superior, Presença Aterradora, Sopro Elemental.</p>
