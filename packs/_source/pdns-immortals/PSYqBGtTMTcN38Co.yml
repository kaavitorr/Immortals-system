name: Tecelão (armeiro)
type: archetype
folder: 26a0e683ac977c63
system:
  description:
    value: >-
      <p>Prepara teias, fios e armadilhas para restringir o movimento inimigo. Prende e puxa os alvos para posições
      desfavoráveis, controlando o espaço ao redor.</p><p><strong>Resistência por ND:</strong> Cortante
      +2</p><p><strong>Vulnerabilidade:</strong> Fogo −10</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Manto de Fios (8 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Percepção, Sobrevivência e Coordenação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Fortitude.</p><p><strong>Aspectos:</strong> Tecelã de Teias, Emboscador, Temperamento Frio, Silenciosa,
      Camuflagem, Analisar Padrões, Escalada Aracnídea, Mente Singular, Visão Aguçada, Algoz
      Invisível.</p><p><strong>Habilidades:</strong> Disparo de Teia, Tecer Acelerado, Armadilha de Pólen, Chicote de
      Cipó, Chicote de Hifas, Raízes Prendedoras, Ilusão Menor, Criar Duplicata, Fuga Escorregadia, Ferrão
      Envenenado.</p><p><strong>Reações:</strong> Disparo Reativo, Teia Reativa, Reflexo.</p>
