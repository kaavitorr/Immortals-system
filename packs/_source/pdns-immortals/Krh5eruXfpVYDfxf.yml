name: Peçonhento (artrópode)
type: archetype
folder: 26a0e683ac977c63
system:
  description:
    value: >-
      <p>Combina pinças, mordidas e ferrões para prender a presa e inocular veneno. Prefere emboscadas e golpes rápidos,
      recuando quando perde a vantagem.</p><p><strong>Resistência por ND:</strong> Veneno
      +2</p><p><strong>Vulnerabilidade:</strong> Fogo −6</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Exoesqueleto (12 + Con).</p><p><strong>Perícias:</strong> Proficiências:
      Percepção, Furtividade, Sobrevivência e Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Emboscador, Ataque Surpresa, Escavador, Tremoresense, Camuflagem,
      Vigoroso, Implacável, Temperamento Frio, Garras Letais, Visão no Escuro.</p><p><strong>Habilidades:</strong>
      Ferrão Envenenado, Golpe de Pinça, Presa Infecciosa, Mordida Infecciosa, Investida, Escavar Túnel, Contenção de
      Pinças, Veneno Concentrado, Retirada Rápida, Salto Precipitado.</p><p><strong>Reações:</strong> Ferrão Reativo,
      Pinça Reativa, Reflexo.</p>
