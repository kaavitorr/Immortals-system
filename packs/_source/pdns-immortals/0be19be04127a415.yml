system:
  description:
    value: >-
      <p>Mantém distância e usa Qi para lançar ataques elementais e controlar o terreno. Recorre a barreiras e
      contrafeitiços para se proteger.</p><p><strong>Resistência por ND:</strong> Alma +1 | Energia
      +1</p><p><strong>Vulnerabilidade:</strong> Físicos −8 | Veneno −6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Armadura Elemental (10 + Int).</p><p><strong>Perícias:</strong>
      Proficiências: Feitiçaria, Sobrenatural, Sobrevivência e Intimidação.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Reflexo e Fortitude.</p><p><strong>Aspectos:</strong> Afinidade Total, Corpo de Catástrofe, Um Com
      o Mundo, Analisar Padrões, Mente Singular, Fanático, Temperamento Frio, Criatura sem Alma, Autossuficiente,
      Presença Aterradora.</p><p><strong>Habilidades:</strong> Baforada Elemental, Canalização da Tempestade,
      Canalização de Terra, Chuva de Raios, Controle Natural, Controle do Tempo, Liberação Elétrica, Pilar de Chamas,
      Prisão de Gelo, Floresta de Pedra.</p><p><strong>Reações:</strong> Contra-Feitiço, Barreira Elemental, Ataque
      Reativo.</p>
