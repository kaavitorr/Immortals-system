system:
  description:
    value: >-
      <p>Influencia a mente do alvo com o olhar, ilusões e sugestões. Prefere desorientar, amedrontar ou controlar o
      oponente a enfrentá-lo em uma troca direta de golpes.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Físicos −8</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 + Sab).</p><p><strong>Perícias:</strong> Proficiências:
      Sobrenatural, Persuasão, Intimidação e Enganação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Hipnose Passiva, Analisar Padrões, Sussurro Perturbador, Algoz
      Invisível, Mente Singular, Aura do Medo, Mimetismo, Fanático, Presença Aterradora,
      Descuidado.</p><p><strong>Habilidades:</strong> Hipnotizar, Medo Instilado, Ilusão Menor, Onda de Charme, Roubo de
      Nome, Beijo Tenebroso, Grito Psíquico, Passo das Sombras, Criar Duplicata, Transferir
      Praga.</p><p><strong>Reações:</strong> Olhar Reativo, Sussurro Reativo, Esquiva Rápida.</p>
