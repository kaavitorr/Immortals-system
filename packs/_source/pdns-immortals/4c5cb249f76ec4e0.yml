system:
  description:
    value: >-
      <p>Criaturas de corpo serpentino, escamas resistentes e poder elemental extraordinário. Sua aparência e a forma
      como manifestam Qi variam conforme a linhagem. Meio-dragões e criaturas que absorveram sangue de dragão também
      podem manifestar seus traços.</p><p>Raridade: Extremamente Raro.</p><p>Afinidade: Um elemento Inicial e um
      elemento Intermediário, escolhidos para a linhagem.</p><p><strong>Resistência:</strong> Físicos +3; dano associado
      ao elemento Inicial escolhido +5.</p><p><strong>Vulnerabilidade:</strong> Psíquico −5; Alma
      −5.</p><p><strong>Deslocamento:</strong> Caminhada 9 m; voo 12 m.</p><p><strong>Armaduras:</strong> Escamas
      Pesadas (14 + Constituição).</p><p><strong>Perícias:</strong> Atletismo, Intimidação, Percepção e Controle de
      Qi.</p><p><strong>Salvaguardas:</strong> Fortitude e Vontade.</p><p><strong>Aspectos:</strong> Afinidade
      Elemental, Voo Espiritual, Sentidos do Dragão, Presença Aterradora.</p><p><strong>Habilidades:</strong> Sopro
      Elemental.</p><p><strong>Ataques comuns:</strong> Mordida (Perfurante), garras (Cortante) e golpe de cauda
      (Contundente).</p>
