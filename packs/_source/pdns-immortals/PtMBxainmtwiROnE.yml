system:
  description:
    value: >-
      <p>Usa vários tentáculos para golpear e prender armas ou membros ao mesmo tempo. Combina agarrões, tinta e
      camuflagem para controlar a distância e escapar.</p><p><strong>Resistência por ND:</strong> Contundente +1 |
      Perfurante +1</p><p><strong>Vulnerabilidade:</strong> Cortante −8 | Elétrico −6 · Mov +1 |
      5/ND</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong> Musculatura
      Densa (10 + Con).</p><p><strong>Perícias:</strong> Proficiências: Coordenação, Furtividade, Percepção e
      Enganação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo, Vontade.</p><p><strong>Aspectos:</strong>
      Bote Sônico, Agarrador, Superfície Adesiva, Mimetismo, Camuflagem, Caminhante de Superfícies, Mente Singular,
      Analisar Padrões, Algoz Invisível, Anfíbio, Reflexos Aguçados.</p><p><strong>Habilidades:</strong> Enrolar, Abraço
      Esmagador, Jato de Tinta, Ataque em Cadeia, Golpe Duplo, Disparo de Teia, Fuga Escorregadia, Ilusão Menor, Esquiva
      Rápida.</p><p><strong>Reações:</strong> Braço Reativo, Agarrar Projétil, Contra-Aperto.</p>
