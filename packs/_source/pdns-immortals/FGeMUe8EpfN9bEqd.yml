system:
  description:
    value: >-
      <p>Luta como uma massa de corpos que cerca e sobrecarrega a presa. Espalha-se, recompõe-se e mantém ataques
      sucessivos por diferentes direções.</p><p><strong>Resistência por ND:</strong> Cortante +1 | Perfurante
      +1</p><p><strong>Vulnerabilidade:</strong> Fogo −6 | Ácido −6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Pele Fina (6 + Agi).</p><p><strong>Perícias:</strong>
      Proficiências: Furtividade, Percepção, Sobrevivência e Atletismo.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Reflexo e Vontade.</p><p><strong>Aspectos:</strong> Mente Singular, Corpo Inerte, Superfície
      Adesiva, Absorção Rápida, Caminhante de Superfícies, Implacável, Tática de Bando, Morte Falsa, Silenciosa, Fome
      Insaciável.</p><p><strong>Habilidades:</strong> Divisão, Ataque em Cadeia, Digestão Rápida, Carnívoro Voraz,
      Regenerar Membro, Nuvem de Esporos, Enrolar, Debandada, Golpe Giratório, Fuga
      Escorregadia.</p><p><strong>Reações:</strong> Reformar Enxame, Ataque em Cadeia, Dispersar.</p>
