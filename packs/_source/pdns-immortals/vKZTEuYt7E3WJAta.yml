    value: >-
      <p>Defende-se junto ao rebanho, usando o peso do corpo em investidas e debandadas. Mantém-se firme diante de
      ameaças e atropela quem bloqueia a passagem.</p><p><strong>Resistência por ND:</strong> Físicos +1 | Frio
      +1</p><p><strong>Vulnerabilidade:</strong> Fogo -6 | Psíquico -6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Couro Pesado (10 + Agi).</p><p><strong>Perícias:</strong>
      Proficiências: Percepção, Furtividade e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo
      e Fortitude.</p><p><strong>Aspectos:</strong> Vigoroso, Corpo Inerte, Estabilidade,
      implacável</p><p><strong>Habilidades:</strong> Agressivo, Investida, Debandada.</p><p><strong>Reações:</strong>
      Nenhuma</p>
