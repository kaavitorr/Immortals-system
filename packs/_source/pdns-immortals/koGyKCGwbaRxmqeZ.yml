name: Cuspidora (naja)
type: archetype
folder: 1bnnSCjbnPuunvFI
system:
  description:
    value: >-
      <p>Cospe veneno para enfraquecer ou cegar a presa antes do bote. Procura conservar a distância e responde à
      aproximação com esquivas, mordidas e novos disparos.</p><p><strong>Resistência por ND:</strong> Veneno
      +2</p><p><strong>Vulnerabilidade:</strong> Fogo −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Percepção,
      Furtividade, Sobrevivência e Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Bote Sônico, Ataque Surpresa, Emboscador, Mordida Infectada, Camuflagem,
      Visão no Escuro, Faro Aguçado, Temperamento Frio, Agarrador, Reflexos Aguçados,
      Silenciosa.</p><p><strong>Habilidades:</strong> Cuspir Veneno, Ferrão Envenenado, Presa Infecciosa, Enrolar,
      Abraço Esmagador, Golpe Preciso, Surto de Velocidade, Fuga Escorregadia, Medo
      Instilado.</p><p><strong>Reações:</strong> Disparo Reativo, Esquiva Rápida, Cuspe Reativo.</p>
