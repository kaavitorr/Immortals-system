system:
  description:
    value: >-
      <p>Observa a presa em ocultação e usa a escuridão para preparar o bote. Depois do ataque, esquiva-se ou muda de
      posição para conservar a iniciativa.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Fogo −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Percepção, Sobrevivência e Coordenação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Fortitude.</p><p><strong>Aspectos:</strong> Emboscador, Camuflagem, Visão no Escuro, Visão Aguçada, Audição
      Aguçada, Silenciosa, Ataque Surpresa, Assassinar, Reflexos Aguçados, Analisar
      Padrões.</p><p><strong>Habilidades:</strong> Bote Sônico, Golpe Letal, Apunhalar, Salto Mortal, Surto de
      Velocidade, Esquiva Rápida, Golpe de Cauda, Contra-Golpe, Perseguição Sem Fim.</p><p><strong>Reações:</strong>
      Bote Surpresa, Esquiva Rápida, Reflexo.</p>
