system:
  description:
    value: >-
      <p>Espera em paredes, tetos e beiradas para atacar de ângulos inesperados. Usa a escalada e movimentos rápidos
      para perseguir a presa ou sair do alcance dela.</p><p><strong>Resistência por ND:</strong> Cortante
      +1</p><p><strong>Vulnerabilidade:</strong> Elétrico −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Percepção, Sobrevivência e Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Caminhante de Superfícies, Escalada Aracnídea, Silenciosa, Visão no
      Escuro, Tremoresense, Emboscador, Ataque Surpresa, Mordida Infectada, Reflexos Aguçados,
      Agressivo.</p><p><strong>Habilidades:</strong> Bote Sônico, Investida Subterrânea, Mordida Infecciosa, Presa
      Infecciosa, Enrolar, Golpe de Cauda, Fuga Escorregadia, Surto de Velocidade, Apunhalar, Esquiva
      Rápida.</p><p><strong>Reações:</strong> Emboscada Reativa, Esquiva Rápida, Mordida Reativa.</p>
