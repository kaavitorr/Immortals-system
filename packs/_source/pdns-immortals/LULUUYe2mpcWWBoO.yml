system:
  description:
    value: >-
      <p>Abala a mente dos inimigos com presságios, gritos e sussurros. Aproveita o medo e a desorientação para atacar
      com o bando ou preparar uma emboscada.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Físicos −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Intimidação, Sobrenatural, Percepção e Enganação.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Presença Aterradora, Aura do Medo, Visão Aguçada, Voo Superior,
      Sobrevoo, Sussurro Perturbador, Analisar Padrões, Tática de Bando, Mente Singular, Algoz
      Invisível.</p><p><strong>Habilidades:</strong> Medo Instilado, Grito Estridente, Imitar Voz, Roubo de Nome, Onda
      de Charme, Ataque de Mergulho, Ataque com Asa, Ilusão Menor, Grito Psíquico, Passo das
      Sombras.</p><p><strong>Reações:</strong> Grito de Agouro, Sussurro Reativo, Alerta.</p>
