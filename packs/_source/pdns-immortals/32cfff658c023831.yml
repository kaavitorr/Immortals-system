  description:
    value: >-
      <p><strong>Ações: ⬢⬢⬢⬢⬢⬢</strong></p><p>Ao gastar 10 PQ, a criatura pode realizar um ataque de mordida contra um
      alvo inconsciente, injetando seu Qi virulento nele. O alvo tem seu corpo transformado pela natureza da habilidade.
      No caso do Drenador, sofre 1d8 de dano de Energia por rodada sob a luz do sol, recebe imunidade a dano de Alma e
      só pode se alimentar de sangue, além de ser suscetível às ordens do Drenador. No caso do Usurpador, torna-se um
      receptáculo perfeito para ele, que pode ocupar o corpo do alvo enquanto ele estiver vivo e usar todas as suas
      habilidades.</p>
