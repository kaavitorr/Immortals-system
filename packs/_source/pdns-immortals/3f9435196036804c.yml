  description:
    value: >-
      <p><strong>Ações: ⬢ [adicional]</strong></p><p>Ao gastar 2 PQ ao anunciar um ataque ou técnica, a criatura se
      atira em direção a um alvo a até 10 metros sem consumir deslocamento. Se o alvo for atingido, deve realizar uma
      Salvaguarda de Fortitude para não ser atirado contra o chão e receber a condição “Caído”, sofrendo 1 dado de dano
      adicional no processo. O alvo fica impedido de se levantar até o fim do próximo turno dele enquanto a criatura que
      o derrubou estiver a 1 metro de distância.</p>
