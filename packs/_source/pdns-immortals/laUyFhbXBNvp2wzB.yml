  description:
    value: >-
      <p>Avança com chifradas e investidas que exploram o peso do corpo. Mantém o equilíbrio sob pressão e reforça a
      própria resistência antes de contra-atacar.</p><p><strong>Resistência por ND:</strong> Contundente
      +2</p><p><strong>Vulnerabilidade:</strong> Psíquico −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Musculatura Densa (10 + Con).</p><p><strong>Perícias:</strong>
      Proficiências: Atletismo, Sobrevivência, Intimidação e Percepção.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Fortitude e Vontade.</p><p><strong>Aspectos:</strong> Estabilidade, Força Descomunal, Vigoroso,
      Implacável, Fanático, Descuidado, Reativo, Corpo Robusto, Temperamento Frio,
      Agressivo.</p><p><strong>Habilidades:</strong> Investida, Investida Derrubadora, Ataque de Chifre, Golpe
      Aterrador, Onda de Choque, Manter Firme, Enrijecer Músculos, Contra-Golpe, Debandada, Salto
      Mortal.</p><p><strong>Reações:</strong> Chifrada Reativa, Endurecer, Ataque Reativo.</p>
