    value: >-
      <p>Essa criatura altera o tempo ao seu redor conforme permanece em uma mesma área. A cada 1 minuto, o raio da área
      afetada aumenta em 3 metros. Quando essa área atingir 100 metros ou mais, a criatura sobe uma categoria de escala,
      seguindo a progressão:</p><p>Lacaio → Normal → Elite → Chefe</p><p>Ela sobe uma nova categoria novamente quando a
      área afetada atingir 1.000 metros, 10.000 metros e 100.000 metros de raio.</p>
