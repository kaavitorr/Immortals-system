  description:
    value: >-
      <p><strong>Ações: ⬢⬢⬢⬢⬢⬢</strong></p><p>Ao gastar 20 PQ, a criatura desfere um golpe contra o chão, liberando uma
      enorme quantidade de Qi e criando um grande terremoto que afeta uma área igual a 250 metros vezes o ND dela. Todas
      as criaturas a 10 metros + 1 metro por ND que estiverem tocando o chão devem realizar uma Salvaguarda de Vontade,
      sofrendo o ND dela em d4 se falharem ou metade se obtiverem sucesso. Todas as criaturas fora da área efetiva do
      dano sofrem 1 de dano para cada 2 NDs dela. Estruturas que não possuam Qi sofrem 30 vezes o dano.</p>
