system:
  description:
    value: >-
      <p>Entrega-se à fúria e mantém uma sequência de golpes agressivos. Usa a Força e os próprios ferimentos para
      intensificar a ofensiva e responder a cada ataque.</p><p><strong>Resistência por ND:</strong> Físicos +1 |
      Psíquico +1</p><p><strong>Vulnerabilidade:</strong> Veneno −6 | Ácido −6</p><p><strong>Deslocamento:</strong>
      Caminhada: 10 m (fixo)</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Atletismo, Intimidação, Sobrevivência e Percepção.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Fúria, Frenesi de Sangue, Ferimento Enfurecedor, Agressivo, Descuidado,
      Fanático, Implacável, Corpo Resistente, Sede de Sangue, Força Descomunal.</p><p><strong>Habilidades:</strong>
      Golpe Duplo, Golpe Giratório, Golpe Esmagador, Investida, Impacto Atordoante, Contra-Golpe, Ataque em Cadeia,
      Grito de Guerra, Enrijecer Músculos, Terremoto.</p><p><strong>Reações:</strong> Fúria Reativa, Contra-Golpe,
      Ignorar Dor.</p>
