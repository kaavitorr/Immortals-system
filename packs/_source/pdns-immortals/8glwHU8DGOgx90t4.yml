system:
  description:
    value: >-
      <p>Coordena os aliados com ordens, marcas e gritos de guerra. Escolhe os alvos prioritários e organiza ataques,
      recuos e ações de cobertura.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Físicos −8</p><p><strong>Deslocamento:</strong> Caminhada: 10 m
      (fixo)</p><p><strong>Armaduras:</strong> Couro Pesado (10 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Persuasão, Intimidação, Investigação e História.</p><p><strong>Salvaguardas:</strong> Proficiências: Presença e
      Reflexo.</p><p><strong>Aspectos:</strong> Presença Aterradora, Intimidadora, Tática de Bando, Analisar Padrões,
      Fanático, Implacável, Vigoroso, Temperamento Frio, Aura do Medo, Reativo.</p><p><strong>Habilidades:</strong>
      Ordem Tática, Grito de Guerra, Marca do Culpado, Rugido Terrível, Investida Derrubadora, Contra-Golpe, Desarme,
      Manter Firme, Esquiva Rápida, Tiro de Cobertura.</p><p><strong>Reações:</strong> Ordem Reativa, Grito de Guerra,
      Convocar.</p>
