name: Protetor (guarda-costas)
type: archetype
folder: 26a0e683ac977c63
system:
  description:
    value: >-
      <p>Permanece perto de quem protege e intercepta os ataques dirigidos ao aliado. Usa o próprio corpo, escudos e
      posturas defensivas para sustentar a proteção.</p><p><strong>Resistência por ND:</strong> Físicos +1 | Fogo
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −8 | Alma −6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Carapaça Leve (8 + For).</p><p><strong>Perícias:</strong>
      Proficiências: Percepção, Atletismo, Intimidação e Investigação.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Vontade e Fortitude.</p><p><strong>Aspectos:</strong> Implacável, Vigoroso, Corpo Resistente,
      Fanático, Estabilidade, Tática de Bando, Corpo Robusto, Reativo, Analisar Padrões,
      Descuidado.</p><p><strong>Habilidades:</strong> Escudo Humano, Zelo do Protetor, Manter Firme, Defesa Robusta,
      Enrijecer Músculos, Contra-Golpe, Agarrar Projétil, Golpe Aterrador, Ordem Tática, Investida
      Derrubadora.</p><p><strong>Reações:</strong> Escudo Reativo, Zelo do Protetor, Endurecer.</p>
