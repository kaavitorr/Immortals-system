system:
  description:
    value: >-
      <p>Controla a curta distância com a lâmina, encadeando cortes e desarmes. Usa leitura do oponente, esquivas e
      contragolpes para conservar a iniciativa.</p><p><strong>Resistência por ND:</strong> Cortante +2 (apara
      lâminas)</p><p><strong>Vulnerabilidade:</strong> Contundente −6</p><p><strong>Deslocamento:</strong> Caminhada: 10
      m (fixo)</p><p><strong>Armaduras:</strong> Couro Leve (6 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Coordenação, Percepção, Atletismo e Intimidação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Fortitude.</p><p><strong>Aspectos:</strong> Reflexos Aguçados, Golpe Preciso, Analisar Padrões, Reativo,
      Agressivo, Descuidado, Silenciosa, Visão Aguçada, Agarrador, Fanático.</p><p><strong>Habilidades:</strong> Golpe
      Duplo, Desarme, Contra-Golpe, Golpe Letal, Esquiva Rápida, Ataque em Cadeia, Apunhalar, Bote Sônico, Investida,
      Salto Mortal.</p><p><strong>Reações:</strong> Desarme Reativo, Esquiva Rápida, Contra-Golpe.</p>
