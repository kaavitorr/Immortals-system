system:
  description:
    value: >-
      <p>Aproxima-se sem ser percebido e explora disfarces, sombras e distrações. Ataca por brechas na vigilância
      inimiga e usa rotas de fuga para evitar o cerco.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6</p><p><strong>Deslocamento:</strong> Caminhada: 10 m
      (fixo)</p><p><strong>Armaduras:</strong> Pele Fina (6 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Investigação, Enganação e Percepção.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo,
      Vontade e Fortitude</p><p><strong>Aspectos:</strong> Silenciosa, Camuflagem, Algoz Invisível, Reflexos Aguçados,
      Analisar Padrões, Emboscador, Ataque Surpresa, Visão no Escuro, Descuidado,
      Fanático.</p><p><strong>Habilidades:</strong> Passo das Sombras, Fuga Escorregadia, Apunhalar, Ilusão Menor,
      Imitar Voz, Desarme, Esquiva Rápida, Roubo de Nome, Golpe Letal, Fingir-se de
      Objeto.</p><p><strong>Reações:</strong> Sombra Reativa, Esquiva Rápida, Fuga Silenciosa.</p>
