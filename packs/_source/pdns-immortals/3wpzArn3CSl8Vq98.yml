system:
  description:
    value: >-
      <p>Usa vários membros para encadear golpes, agarrões e contra-ataques. Pressiona por diferentes ângulos e prende
      armas ou oponentes durante a troca de ataques.</p><p><strong>Resistência por ND:</strong> Físicos +1 | Ácido
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6 | Alma −6 · Mov +1 |
      5/ND</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong> Musculatura
      Densa (10 + Con).</p><p><strong>Perícias:</strong> Proficiências: Atletismo, Intimidação, Percepção e
      Sobrenatural.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Corpo Inerte, Agressivo, Fanático, Implacável, Descuidado, Corpo
      Robusto, Reativo, Mente Inexistente, Analisar Padrões, Aura do Medo.</p><p><strong>Habilidades:</strong> Golpe
      Duplo, Golpe Giratório, Ataque em Cadeia, Enrolar, Abraço Esmagador, Regenerar Membro, Impacto Atordoante,
      Contra-Golpe, Agarrar Projétil, Golpe Esmagador.</p><p><strong>Reações:</strong> Golpe Adicional, Contra-Golpe,
      Agarrar Projétil.</p>
