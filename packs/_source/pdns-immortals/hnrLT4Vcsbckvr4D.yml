system:
  description:
    value: >-
      <p>Ataca de perto com mordidas e golpes que contaminam a presa. Consome carne e vitalidade para se recompor e
      prolongar o combate.</p><p><strong>Resistência por ND:</strong> Veneno +2 | Ácido
      +2</p><p><strong>Vulnerabilidade:</strong> Fogo −8 | Alma −6</p><p><strong>Deslocamento:</strong> +1 até um máximo
      de 25</p><p><strong>Armaduras:</strong> Pele Grossa (10 + Con).</p><p><strong>Perícias:</strong> Proficiências:
      Sobrevivência, Percepção, Medicina e Furtividade.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Fome Insaciável, Carnívoro Voraz, Corpo Inerte, Vontade de Morto-Vivo,
      Faro Aguçado, Mente Inexistente, Descuidado, Sede de Sangue, Pele Grossa,
      Vigoroso.</p><p><strong>Habilidades:</strong> Mordida Voraz, Mordida de Zumbi, Transferir Praga, Digestão Rápida,
      Regenerar Membro, Drenagem de Sangue, Bote Sônico, Divisão, Fuga Escorregadia,
      Contra-Golpe.</p><p><strong>Reações:</strong> Mordida Reativa, Fome Reativa, Reflexo.</p>
