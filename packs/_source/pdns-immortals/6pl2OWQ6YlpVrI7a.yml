system:
  description:
    value: >-
      <p>Muda a aparência e a forma do corpo para confundir a mira inimiga. Alterna disfarces, duplicatas e recomposição
      corporal para atacar ou escapar.</p><p><strong>Resistência por ND:</strong> Cortante +1 | Contundente
      +1</p><p><strong>Vulnerabilidade:</strong> Fogo −8 | Elétrico −6 · Mov +1 |
      5/ND</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong> Pele Grossa (10
      + Agi).</p><p><strong>Perícias:</strong> Proficiências: Furtividade, Enganação, Sobrenatural e
      Percepção.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e Vontade.</p><p><strong>Aspectos:</strong>
      Mimetismo, Camuflagem, Regeneração Lenta, Corpo Inerte, Mente Inexistente, Analisar Padrões, Descuidado, Fanático,
      Reflexos Aguçados, Algoz Invisível.</p><p><strong>Habilidades:</strong> Trocar de Forma, Divisão, Regenerar
      Membro, Criar Duplicata, Ilusão Menor, Fuga Escorregadia, Golpe Duplo, Mordida Voraz, Passo das Sombras, Esquiva
      Rápida.</p><p><strong>Reações:</strong> Forma Reativa, Esquiva Rápida, Contra-Golpe.</p>
