system:
  description:
    value: >-
      <p>Reconhece o terreno, rastreia a presa e orienta os aliados durante o cerco. Usa seus sentidos e sua mobilidade
      para atacar em grupo ou recuar quando isolada.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Alma −6</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Percepção,
      Furtividade, Sobrevivência e Coordenação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Fortitude.</p><p><strong>Aspectos:</strong> Faro Aguçado, Visão Aguçada, Audição Aguçada, Sentidos Aguçados,
      Camuflagem, Silenciosa, Tática de Bando, Reflexos Aguçados, Visão no Escuro,
      Tremoresense.</p><p><strong>Habilidades:</strong> Rastrear pelo Cheiro, Surto de Velocidade, Esquiva Rápida, Ordem
      Tática, Perseguição Sem Fim, Fuga Escorregadia, Passo das Sombras, Tiro Preciso, Grito de
      Guerra.</p><p><strong>Reações:</strong> Alerta, Esquiva Rápida, Reflexo.</p>
