system:
  description:
    value: >-
      <p>Reúne maldições com formas de dragões ocidentais ou orientais, desde filhotes até exemplares colossais. Em
      geral, vivem e caçam de maneira solitária.</p><p>Variações de tamanho e deslocamento:</p><p>Dragão Filhote:
      Tamanho Pequeno; deslocamento 7 m.</p><p>Dragão Jovem: Tamanho Grande; deslocamento 10 m.</p><p>Dragão Adulto:
      Tamanho Enorme; deslocamento 20 m.</p><p>Dragão Poderoso: Tamanho Imenso; deslocamento 25 m.</p><p>Essas criaturas
      não constituem uma espécie natural neste mundo: são maldições originadas do medo e das lendas sobre dragões,
      geralmente de grau especial.</p><p><strong>Resistência:</strong> Elemento Base +3 Por
      ND</p><p><strong>Vulnerabilidade:</strong> Elemento Contrário −1 por ND</p><p><strong>Deslocamento:</strong>
      Todos: Especial</p><p><strong>Armaduras:</strong> Placas Pesadas (16 + For).</p><p><strong>Perícias:</strong>
      Proficiências: Atletismo, Coordenação, Intimidação, Sobrenatural, Percepção
      Sorte.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e Vontade.</p><p><strong>Aspectos:</strong>
      Escamas de Aço, Presença Aterradora, Sopro Elemental.</p>
