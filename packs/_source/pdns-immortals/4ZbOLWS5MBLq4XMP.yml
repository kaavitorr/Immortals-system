system:
  description:
    value: >-
      <p>Enrola o corpo na presa e a imobiliza por compressão. Usa a própria força e resistência para manter o aperto
      enquanto impede a fuga do alvo.</p><p><strong>Resistência por ND:</strong> Contundente
      +2</p><p><strong>Vulnerabilidade:</strong> Perfurante −8</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Musculatura Densa (10 + Con).</p><p><strong>Perícias:</strong> Proficiências:
      Atletismo, Furtividade, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Agarrador, Implacável, Corpo Robusto, Estabilidade, Vigoroso,
      Temperamento Frio, Escamas de Aço, Sentidos Aguçados, Camuflagem, Fanático.</p><p><strong>Habilidades:</strong>
      Enrolar, Abraço Esmagador, Bote Sônico, Investida Derrubadora, Golpe Esmagador, Enrijecer Músculos, Manter Firme,
      Defesa Robusta, Golpe de Cauda, Digestão Rápida.</p><p><strong>Reações:</strong> Contra-Aperto, Enrijecer
      Músculos, Agarrar Projétil.</p>
