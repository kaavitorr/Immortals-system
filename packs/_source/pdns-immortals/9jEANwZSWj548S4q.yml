system:
  description:
    value: >-
      <p>Aproxima-se, golpeia e se afasta em movimentos rápidos. Combina ataques sucessivos com esquivas e mudanças de
      posição para dificultar a retaliação.</p><p><strong>Resistência por ND:</strong> Elétrico
      +2</p><p><strong>Vulnerabilidade:</strong> Frio −6</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Pele Fina (6 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Coordenação, Atletismo e Percepção.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Reflexos Aguçados, Ataque Surpresa, Agressivo, Silenciosa, Visão
      Aguçada, Camuflagem, Escalada Aracnídea, Descuidado, Analisar Padrões,
      Agarrador.</p><p><strong>Habilidades:</strong> Surto de Velocidade, Bote Sônico, Golpe Duplo, Esquiva Rápida,
      Salto Mortal, Ataque em Cadeia, Passo das Sombras, Contra-Golpe, Fuga Escorregadia, Golpe
      Preciso.</p><p><strong>Reações:</strong> Reflexo, Esquiva Rápida, Contra-Golpe.</p>
