name: Atirador (cuspidor)
type: archetype
folder: 26a0e683ac977c63
system:
  description:
    value: >-
      <p>Ataca de longe com cuspes, projéteis naturais ou objetos arremessados. Usa precisão e reposicionamento para
      continuar atacando sem ser alcançada.</p><p><strong>Resistência por ND:</strong> Veneno
      +1</p><p><strong>Vulnerabilidade:</strong> Contundente −8</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Percepção,
      Coordenação, Furtividade e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Fortitude.</p><p><strong>Aspectos:</strong> Visão Aguçada, Golpe Preciso, Emboscador, Camuflagem, Analisar
      Padrões, Reflexos Aguçados, Silenciosa, Temperamento Frio, Tremoresense,
      Descuidado.</p><p><strong>Habilidades:</strong> Tiro Preciso, Cuspir Veneno, Cuspe Ácido, Disparo de Teia, Estacas
      de Gelo, Chuva de Espinhos, Tiro de Cobertura, Esquiva Rápida, Fuga Escorregadia, Lançar
      Rocha.</p><p><strong>Reações:</strong> Disparo Reativo, Esquiva Rápida, Recarga Rápida.</p>
