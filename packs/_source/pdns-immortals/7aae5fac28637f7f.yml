system:
  description:
    value: >-
      <p>Aves espirituais cujo corpo é formado por chamas vivas. Sua existência está ligada ao fogo, à renovação da vida
      e ao renascimento a partir das próprias cinzas.</p><p>Raridade: Extremamente Raro.</p><p>Afinidade: Fogo
      (Inicial).</p><p><strong>Resistência:</strong> Fogo +10; Físicos +3.</p><p><strong>Vulnerabilidade:</strong> Frio
      −6; Alma −5.</p><p><strong>Deslocamento:</strong> Caminhada 6 m; voo 12 m.</p><p><strong>Armaduras:</strong>
      Armadura Elemental (10 + Intelecto).</p><p><strong>Perícias:</strong> Controle de Qi, Percepção, Sobrevivência e
      Coordenação.</p><p><strong>Salvaguardas:</strong> Vontade e Reflexo.</p><p><strong>Aspectos:</strong> Corpo de
      Chamas, Asas Incandescentes, Nutrição Ígnea, Brasa do Renascimento.</p><p><strong>Habilidades:</strong> Chamas
      Restauradoras.</p><p><strong>Ataques comuns:</strong> Bicada (Perfurante), garras (Cortante) e toque de chamas
      (Fogo).</p>
