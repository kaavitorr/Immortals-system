system:
  description:
    value: >-
      <p>Rouba identidades e usa nomes, vozes e aparências alheias para enganar. Combina ilusões e mobilidade para
      explorar a confusão e evitar trocas diretas de golpes.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Ácido −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 + Sab).</p><p><strong>Perícias:</strong>
      Proficiências: Enganação, Sobrenatural, Persuasão e Sorte.</p><p><strong>Salvaguardas:</strong> Proficiências:
      Reflexo e Vontade.</p><p><strong>Aspectos:</strong> Silenciosa, Algoz Invisível, Reflexos Aguçados, Camuflagem,
      Voo Superior, Sobrevoo, Analisar Padrões, Sussurro Perturbador, Mente Singular,
      Descuidado.</p><p><strong>Habilidades:</strong> Roubo de Nome, Ilusão Menor, Passo das Sombras, Fuga Escorregadia,
      Imitar Voz, Criar Duplicata, Medo Instilado, Esquiva Rápida, Onda de Charme,
      Desarme.</p><p><strong>Reações:</strong> Roubo Reativo, Esquiva Rápida, Ilusão Reativa.</p>
