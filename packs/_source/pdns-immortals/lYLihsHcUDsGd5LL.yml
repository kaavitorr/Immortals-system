  description:
    value: >-
      <p>Explora distrações, disfarces e truques para desequilibrar o oponente. Desarma, ataca pelas brechas e muda de
      posição quando perde a vantagem.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Furtividade,
      Enganação, Coordenação e Sorte.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Reflexos Aguçados, Camuflagem, Silenciosa, Analisar Padrões, Descuidado,
      Algoz Invisível, Mente Singular, Fanático, Sussurro Perturbador, Audição
      Aguçada.</p><p><strong>Habilidades:</strong> Desarme, Roubo de Nome, Ilusão Menor, Esquiva Rápida, Fuga
      Escorregadia, Passo das Sombras, Fingir-se de Objeto, Apunhalar, Tiro de Cobertura, Imitar
      Voz.</p><p><strong>Reações:</strong> Desarme Reativo, Reflexo, Esquiva Rápida.</p>
