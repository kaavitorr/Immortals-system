system:
  description:
    value: >-
      <p>Acompanha o aliado protegido e intercepta ameaças antes que o atinjam. Combina escudos, manobras defensivas e
      contra-ataques para manter a proteção.</p><p><strong>Resistência por ND:</strong> Físicos +1 | Fogo
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −8 | Alma −6</p><p><strong>Deslocamento:</strong> Caminhada:
      10 m (fixo)</p><p><strong>Armaduras:</strong> Placas Leves (12 + For).</p><p><strong>Perícias:</strong>
      Proficiências: Percepção, Atletismo, Intimidação e Coordenação.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Vontade e Fortitude.</p><p><strong>Aspectos:</strong> Vigoroso, Reativo, Implacável, Fanático,
      Tática de Bando, Corpo Resistente, Reflexos Aguçados, Analisar Padrões, Estabilidade, Corpo
      Robusto.</p><p><strong>Habilidades:</strong> Escudo Humano, Zelo do Protetor, Manter Firme, Defesa Robusta,
      Contra-Golpe, Desarme, Ordem Tática, Investida Derrubadora, Enrijecer Músculos, Agarrar
      Projétil.</p><p><strong>Reações:</strong> Escudo Reativo, Interceptação, Endurecer.</p>
