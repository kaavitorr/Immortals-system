  description:
    value: >-
      <p>Pressiona o inimigo com golpes pesados e decisivos. Usa intimidação, empurrões e ataques devastadores para
      quebrar a resistência de alvos vulneráveis.</p><p><strong>Resistência por ND:</strong> Físicos
      +2</p><p><strong>Vulnerabilidade:</strong> Psíquico −8</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Musculatura Densa (10 + Con).</p><p><strong>Perícias:</strong> Proficiências:
      Intimidação, Atletismo, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Presença Aterradora, Força Descomunal, Implacável, Corpo Robusto,
      Descuidado, Fanático, Intimidadora, Golpe Preciso, Corpo Inerte, Aura do Medo.</p><p><strong>Habilidades:</strong>
      Golpe Letal, Golpe Esmagador, Execução Guardiã, Investida Derrubadora, Onda de Choque, Golpe Aterrador, Rugido
      Terrível, Desarme, Manter Firme, Terremoto.</p><p><strong>Reações:</strong> Ataque Reativo, Contra-Golpe,
      Enrijecer Músculos.</p>
