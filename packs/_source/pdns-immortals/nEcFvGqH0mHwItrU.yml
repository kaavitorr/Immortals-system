system:
  description:
    value: >-
      <p>Concentra-se em um adversário e observa seu ritmo para explorar brechas. Usa desarmes, esquivas e respostas
      precisas para transformar a defesa em contra-ataque.</p><p><strong>Resistência por ND:</strong> Cortante
      +2</p><p><strong>Vulnerabilidade:</strong> Contundente −6</p><p><strong>Deslocamento:</strong> Caminhada: 10 m
      (fixo)</p><p><strong>Armaduras:</strong> Couro Leve (6 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Coordenação, Persuasão, Percepção e Intimidação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Reflexos Aguçados, Golpe Preciso, Analisar Padrões, Reativo, Fanático,
      Presença Aterradora, Descuidado, Intimidadora, Silenciosa, Agressivo.</p><p><strong>Habilidades:</strong>
      Contra-Golpe, Desarme, Golpe Letal, Esquiva Rápida, Golpe Duplo, Apunhalar, Marca do Culpado, Investida, Salto
      Mortal, Impacto Atordoante.</p><p><strong>Reações:</strong> Riposte, Desarme Reativo, Esquiva Elegante.</p>
