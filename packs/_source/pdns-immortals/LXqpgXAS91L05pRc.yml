name: Encantador (sereia)
type: archetype
folder: 26a0e683ac977c63
system:
  description:
    value: >-
      <p>Atrai e manipula a vítima com a voz e com encantamentos. Desvia sua atenção e influencia suas decisões,
      preparando uma aproximação favorável para atacar.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Físicos −8</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 + Sab).</p><p><strong>Perícias:</strong> Proficiências:
      Atuação, Persuasão, Enganação e Sobrenatural.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Hipnose Passiva, Aura do Medo, Sussurro Perturbador, Presença
      Aterradora, Camuflagem, Mimetismo, Analisar Padrões, Visão Aguçada, Fanático, Mente
      Singular.</p><p><strong>Habilidades:</strong> Cantiga Hipnótica, Onda de Charme, Beijo Tenebroso, Hipnotizar, Medo
      Instilado, Ilusão Menor, Imitar Voz, Criar Duplicata, Roubo de Nome, Jato de
      Tinta.</p><p><strong>Reações:</strong> Charme Reativo, Sussurro Reativo, Esquiva Rápida.</p>
