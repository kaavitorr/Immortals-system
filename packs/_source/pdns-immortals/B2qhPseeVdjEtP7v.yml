name: Devorador de Luz
type: archetype
folder: 29e85c5a0e7a7147
system:
  description:
    value: >-
      <p>Apaga fontes de luz para ocultar seus movimentos e desorientar a presa. Ataca nas sombras e usa ilusões, medo e
      deslocamentos súbitos para evitar represálias.</p><p><strong>Resistência por ND:</strong> Físicos +1 | Frio
      +1</p><p><strong>Vulnerabilidade:</strong> Fogo −8 | Alma −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong>
      +1 até um máximo de 25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 +
      Sab).</p><p><strong>Perícias:</strong> Proficiências: Furtividade, Sobrenatural, Percepção e
      Intimidação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Algoz Invisível, Silenciosa, Criatura sem Alma, Camuflagem, Aura do
      Medo, Mente Singular, Visão no Escuro, Reflexos Aguçados, Sussurro Perturbador,
      Fanático.</p><p><strong>Habilidades:</strong> Apagar Luzes, Passo das Sombras, Medo Instilado, Grito Psíquico,
      Dreno da Alma, Ilusão Menor, Esquiva Rápida, Bote Sônico, Roubo de Nome, Fingir-se de
      Objeto.</p><p><strong>Reações:</strong> Apagar Luzes, Sombra Reativa, Esquiva Rápida.</p>
