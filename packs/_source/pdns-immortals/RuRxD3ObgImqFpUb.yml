name: Semeador (invocador)
type: archetype
folder: 26a0e683ac977c63
system:
  description:
    value: >-
      <p>Produz crias, cópias e outras criaturas para lutar em seu lugar. Mantém a pressão por meio delas e as utiliza
      para atacar, bloquear passagens ou receber golpes.</p><p><strong>Resistência por ND:</strong> Psíquico +1 | Veneno
      +1</p><p><strong>Vulnerabilidade:</strong> Alma −10 | Fogo −6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 + Sab).</p><p><strong>Perícias:</strong>
      Proficiências: Feitiçaria, Sobrenatural, Intimidação e Sobrevivência.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Reflexo e Fortitude.</p><p><strong>Aspectos:</strong> Mente Singular, Implacável, Fanático,
      Autossuficiente, Corpo Inerte, Tática de Bando, Analisar Padrões, Mente Inexistente, Vigoroso,
      Silenciosa.</p><p><strong>Habilidades:</strong> Invocar Crias, Semear Filhotes, Divisão, Nuvem de Esporos,
      Transferir Praga, Criar Duplicata, Disparo de Teia, Armadilha de Pólen, Regenerar Membro, Onda de
      Choque.</p><p><strong>Reações:</strong> Cria Reativa, Esporos Reativos, Ataque Reativo.</p>
