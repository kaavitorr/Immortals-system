system:
  description:
    value: >-
      <p>Imita um brinquedo ou objeto inofensivo e espera que a vítima se aproxime. Ataca de surpresa e recorre a
      ilusões, agarrões ou fugas rápidas quando é descoberta.</p><p><strong>Resistência por ND:</strong> Contundente +1
      | Veneno +1</p><p><strong>Vulnerabilidade:</strong> Fogo −6 | Cortante −6</p><p><strong>Deslocamento:</strong> +1
      até um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Enganação, Furtividade, Atuação e Coordenação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Camuflagem, Algoz Invisível, Mente Inexistente, Criatura sem Alma,
      Autossuficiente, Morte Falsa, Corpo Inerte, Silenciosa, Sussurro Perturbador,
      Descuidado.</p><p><strong>Habilidades:</strong> Fingir-se de Objeto, Imitar Voz, Roubo de Nome, Apunhalar, Ilusão
      Menor, Medo Instilado, Passo das Sombras, Esquiva Rápida, Enrolar, Fuga
      Escorregadia.</p><p><strong>Reações:</strong> Mordida Escondida, Fuga Escorregadia, Ilusão Reativa.</p>
