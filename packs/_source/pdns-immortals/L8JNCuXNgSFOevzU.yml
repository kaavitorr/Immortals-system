system:
  description:
    value: >-
      <p>Imita objetos ou criaturas comuns para se aproximar sem despertar suspeitas. Ataca quando a presa baixa a
      guarda e usa mudanças de forma para despistá-la.</p><p><strong>Resistência por ND:</strong> Psíquico
      +1</p><p><strong>Vulnerabilidade:</strong> Alma −6</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Enganação,
      Furtividade, Percepção e Atuação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Mimetismo, Camuflagem, Analisar Padrões, Algoz Invisível, Silenciosa,
      Descuidado, Fanático, Criatura sem Alma, Sussurro Perturbador, Mente
      Inexistente.</p><p><strong>Habilidades:</strong> Fingir-se de Objeto, Imitar Voz, Trocar de Forma, Ilusão Menor,
      Criar Duplicata, Roubo de Nome, Bote Sônico, Golpe Letal, Esquiva Rápida, Passo das
      Sombras.</p><p><strong>Reações:</strong> Falsa Forma, Contra-Golpe, Reflexo.</p>
