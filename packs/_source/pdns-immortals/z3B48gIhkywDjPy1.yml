system:
  description:
    value: >-
      <p>Protege um lugar ou ser ao qual está vinculada. Sustenta a posição, resiste a deslocamentos e concentra sua
      Força contra quem ameaça aquilo que guarda.</p><p><strong>Resistência por ND:</strong> Cortante +2 | Perfurante +2
      | Fogo +2 | Frio + 2 | Ácido +2 | Elétrico +3</p><p><strong>Vulnerabilidade:</strong> Contundente -8 | Psíquico
      -8</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong> Pele de Pedra (14
      + Con).</p><p><strong>Perícias:</strong> Proficiências: Atletismo, Percepção, Sobrevivência,
      Intimidação</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Sentidos Aguçados, Domínio de Proteção Natural, Força da Natureza, Corpo
      Inerte, Implacável.</p><p><strong>Habilidades:</strong> Força Aprimorada, Manter Firme, Execução Guardiã, Força
      Imparável.</p><p><strong>Reações:</strong> Endurecer.</p>
