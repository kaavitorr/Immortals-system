system:
  description:
    value: >-
      <p>Recompõe o corpo e recupera membros durante o combate. Usa sua resistência para prolongar a luta, mantendo
      golpes e contra-ataques enquanto se recupera.</p><p><strong>Resistência por ND:</strong> Cortante +1 | Perfurante
      +1</p><p><strong>Vulnerabilidade:</strong> Fogo −10 | Ácido −6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Sobrevivência, Medicina, Percepção e Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Bote Sônico, Corpo Inerte, Implacável, Vigoroso, Autossuficiente,
      Corpo Resistente, Mente Inexistente, Fanático, Temperamento Frio, Absorção Rápida, Vontade de
      Morto-Vivo.</p><p><strong>Habilidades:</strong> Regenerar Membro, Divisão, Enrijecer Músculos, Mordida Voraz,
      Digestão Rápida, Fuga Escorregadia, Manter Firme, , Transferir Praga,
      Contra-Golpe.</p><p><strong>Reações:</strong> Regeneração Reativa, Endurecer, Contra-Golpe.</p>
