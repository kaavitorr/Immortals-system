system:
  description:
    value: >-
      <p>Combatente aérea de desgaste e suporte, que combina fogo persistente, recuperação e proteção de sua centelha
      vital.</p><p><strong>Resistência por ND:</strong> Fogo +2 por nível.</p><p><strong>Vulnerabilidade:</strong> Frio
      −8.</p><p><strong>Deslocamento por ND:</strong> Ganho de 1 m por nível, até o máximo de 25 m em cada modalidade
      existente.</p><p><strong>Armaduras:</strong> Mantém Armadura Elemental.</p><p><strong>Perícias:</strong> Controle
      de Qi, Coordenação, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Vontade, Reflexo e
      Fortitude.</p><p><strong>Aspectos:</strong> Plumas Ardentes [Nv. 1], Aurora Imortal [Nv.
      15].</p><p><strong>Habilidades:</strong> Voo de Brasas [Nv. 2], Chama Restauradora [Nv. 3], Fogo Purificador [Nv.
      6], Explosão de Cinzas [Nv. 8], Ninho da Renovação [Nv. 10], Coração da Fornalha [Nv.
      12].</p><p><strong>Reações:</strong> Manto Incandescente [Nv. 5], Última Labareda [Nv. 14].</p>
