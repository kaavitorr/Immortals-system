  description:
    value: >-
      <p>No início de cada turno da criatura, todas as criaturas dentro de um raio de 10 metros + 1 metro para cada ND
      que ela possuir, e que tenham um atributo de Presença inferior ao dela, devem realizar uma Salvaguarda de Vontade
      com CD igual a 10 + o Atributo Principal da criatura. Em caso de falha, recebem a condição “Amedrontado” por 1
      minuto ou até sofrer dano.</p><p>Uma criatura afetada fica imune a essa característica por um número de rodadas
      igual ao tempo que ficou afetada.</p>
