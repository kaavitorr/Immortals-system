system:
  description:
    value: >-
      <p>Lança cargas e ataques que atingem áreas do campo de batalha. Pressiona grupos com explosões e rajadas,
      aproveitando o terreno para manter distância.</p><p><strong>Resistência por ND:</strong> Fogo +2 | Ácido
      +1</p><p><strong>Vulnerabilidade:</strong> Cortante −10 | Elétrico −6</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Pele Calcinada (10 + Con).</p><p><strong>Perícias:</strong>
      Proficiências: Coordenação, Percepção, Sobrevivência e Atletismo.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Vontade e Reflexo.</p><p><strong>Aspectos:</strong> Afinidade Total, Analisar Padrões, Descuidado,
      Corpo Inerte, Vigoroso, Fanático, Implacável, Tremoresense, Corpo Robusto,
      Autossuficiente.</p><p><strong>Habilidades:</strong> Lançar Rocha, Cuspe Ácido, Explodir, Rajada Ácida, Chuva de
      Espinhos, Erupção Flamejante, Onda de Choque, Pilar de Chamas, Impacto Atordoante,
      Conflagração.</p><p><strong>Reações:</strong> Impacto Explosivo, Estilhaço Reativo, Ataque Reativo.</p>
