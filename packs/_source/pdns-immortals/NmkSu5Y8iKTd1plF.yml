system:
  description:
    value: >-
      <p>Aguarda a presa em ambientes aquáticos, agarra-a e a arrasta para o fundo. Usa a água para limitar sua reação e
      submerge novamente quando é pressionada.</p><p><strong>Resistência por ND:</strong> Frio
      +2</p><p><strong>Vulnerabilidade:</strong> Elétrico −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Percepção, Atletismo e Sobrenatural.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Agarrador, Algoz Invisível, Anfíbio, Silenciosa, Camuflagem, Aura do
      Medo, Fanático, Implacável, Descuidado, Faro Aguçado.</p><p><strong>Habilidades:</strong> Enrolar, Abraço
      Esmagador, Bote Sônico, Imersão de Fuga, Drenagem de Sangue, Cantiga Hipnótica, Perseguição Sem Fim, Fuga
      Escorregadia, Golpe Esmagador, Medo Instilado.</p><p><strong>Reações:</strong> Arrasto Reativo, Mordida Reativa,
      Imersão de Fuga.</p>
