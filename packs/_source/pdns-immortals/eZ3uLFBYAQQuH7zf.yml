system:
  description:
    value: >-
      <p>Explora o próprio tamanho para dominar espaço e alcançar vários inimigos. Abala o terreno, arremessa objetos e
      desfere golpes de grande impacto.</p><p><strong>Resistência por ND:</strong> Físicos +2 | Fogo
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6 | Alma −6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Musculatura Densa (10 + Con).</p><p><strong>Perícias:</strong>
      Proficiências: Atletismo, Intimidação, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Fortitude e Vontade.</p><p><strong>Aspectos:</strong> Força Descomunal, Corpo Robusto,
      Estabilidade, Implacável, Presença Aterradora, Corpo Inerte, Fanático, Intimidadora, Vigoroso, Aura do
      Medo.</p><p><strong>Habilidades:</strong> Terremoto, Onda de Choque, Golpe Aterrador, Investida Derrubadora,
      Lançar Rocha, Golpe Esmagador, Enrijecer Músculos, Rugido Terrível, Manter Firme, Floresta de
      Pedra.</p><p><strong>Reações:</strong> Ataque Reativo, Onda de Choque Reativa, Agarrar Projétil.</p>
