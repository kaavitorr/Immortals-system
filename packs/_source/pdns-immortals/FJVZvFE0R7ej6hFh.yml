system:
  description:
    value: >-
      <p>Combina botes frontais com ataques da cauda para surpreender pelos flancos. Usa mordidas, veneno e agarrões
      para explorar a distração da presa.</p><p><strong>Resistência por ND:</strong> Veneno
      +2</p><p><strong>Vulnerabilidade:</strong> Frio −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Percepção, Sobrevivência e Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Ataque Surpresa, Emboscador, Mordida Infectada, Agarrador, Reflexos
      Aguçados, Silenciosa, Visão no Escuro, Camuflagem, Golpe Preciso, Agressivo.</p><p><strong>Habilidades:</strong>
      Golpe de Cauda, Enrolar, Apunhalar, Bote Sônico, Cuspir Veneno, Presa Infecciosa, Ataque em Cadeia, Esquiva
      Rápida, Fuga Escorregadia, Golpe Letal.</p><p><strong>Reações:</strong> Ferrão Reativo, Esquiva Rápida, Bote
      Surpresa.</p>
