system:
  description:
    value: >-
      <p>Abre espaço com rugidos que intimidam e desestabilizam a presa. Avança em botes e golpes pesados, respondendo à
      aproximação com contra-ataques.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Intimidação, Percepção, Atletismo e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Presença Aterradora, Intimidadora, Aura do Medo, Força Descomunal,
      Fanático, Ferimento Enfurecedor, Implacável, Corpo Robusto, Tática de Bando,
      Reativo.</p><p><strong>Habilidades:</strong> Rugido Terrível, Investida Derrubadora, Golpe Esmagador, Bote Sônico,
      Grito de Guerra, Onda de Choque, Contra-Golpe, Marca do Culpado, Impacto Atordoante, Execução
      Guardiã.</p><p><strong>Reações:</strong> Rugido Reativo, Contra-Golpe, Bote Reativo.</p>
