  description:
    value: >-
      <p><strong>Ações:</strong> ⬢⬢⬢⬢⬢</p><p>A criatura envolve a percepção de um alvo em uma cena ilusória contínua,
      construída a partir do que observa sobre ele. Ao usar 5 Pontos de Ação [⬢⬢⬢⬢⬢] e 10 PQ. A criatura pode realizar
      um Teste de Atributo de Investigação, seguido por um de Enganação, contra o valor de Vontade do alvo. Em caso de
      sucesso, a criatura recebe a condição &quot;Alucinado&quot; e vai ver o que o usuário quiser que ele veja, mas não
      necessariamente irá se tornar agressivo. A criatura pode realizar uma Salvaguarda de Vontade para tentar se
      libertar toda vez que sofrer dano.</p>
