name: Usurpador
type: archetype
folder: dcb7bdd3e7181c6f
system:
  description:
    value: >-
      <p>Usurpa o corpo de um hospedeiro e luta por meio dele. Usa esse vínculo para se proteger, transferir danos e
      procurar outro corpo quando sua posição é ameaçada.</p><p><strong>Resistência por ND:</strong> Veneno
      +2</p><p><strong>Vulnerabilidade:</strong> Fogo −8 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Medicina,
      Furtividade, Sobrenatural e Percepção.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Algoz Invisível, Silenciosa, Camuflagem, Corpo Inerte, Mente
      Inexistente, Fanático, Implacável, Agarrador, Absorção Rápida, Temperamento
      Frio.</p><p><strong>Habilidades:</strong> Transferir Praga, Mordida Transformadora, Drenagem de Sangue, Divisão,
      Invocar Crias, Semear Filhotes, Fuga Escorregadia, Enrolar, Ilusão Menor, Regenerar
      Membro.</p><p><strong>Reações:</strong> Salto de Corpo, Contenção Reativa, Reflexo.</p>
