name: Esmagador
type: archetype
folder: 1bnnSCjbnPuunvFI
system:
  description:
    value: >-
      <p>Agarra a presa com pinças, mandíbulas ou membros robustos e a esmaga de perto. Sustenta o aperto e reage às
      tentativas de fuga com força e contra-ataques.</p><p><strong>Resistência por ND:</strong> Cortante
      +2</p><p><strong>Vulnerabilidade:</strong> Contundente −8 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1
      até um máximo de 25</p><p><strong>Armaduras:</strong> Musculatura Densa (10 +
      Con).</p><p><strong>Perícias:</strong> Proficiências: Atletismo, Intimidação, Percepção e
      Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Agarrador, Força Descomunal, Pele Grossa, Carapaça, Estabilidade,
      Implacável, Corpo Inerte, Vigoroso, Temperamento Frio, Analisar Padrões.</p><p><strong>Habilidades:</strong>
      Abraço Esmagador, Golpe Esmagador, Enrijecer Músculos, Agarrar Projétil, Manter Firme, Defesa Robusta, Investida
      Derrubadora, Contra-Golpe, Golpe de Cauda, Onda de Choque.</p><p><strong>Reações:</strong> Pinça Reativa,
      Contra-Aperto, Enrijecer Músculos.</p>
