system:
  description:
    value: >-
      <p>Imita vozes e usa sussurros e gritos psíquicos para perturbar a mente inimiga. Recorre ao medo, às ilusões e às
      vozes dos mortos para controlar o confronto.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Alma −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 + Sab).</p><p><strong>Perícias:</strong>
      Proficiências: Enganação, Atuação, Percepção e Sobrenatural.</p><p><strong>Salvaguardas:</strong> Proficiências:
      Presença e Reflexo.</p><p><strong>Aspectos:</strong> Sussurro Perturbador, Hipnose Passiva, Criatura sem Alma,
      Mente Inexistente, Aura do Medo, Presença Aterradora, Algoz Invisível, Fanático, Descuidado,
      Silenciosa.</p><p><strong>Habilidades:</strong> Imitar Voz, Roubo de Nome, Medo Instilado, Grito Psíquico, Onda de
      Charme, Ilusão Menor, Passo das Sombras, Fingir-se de Objeto, Beijo Tenebroso, Dreno da
      Alma.</p><p><strong>Reações:</strong> Voz dos Mortos, Sussurro Reativo, Grito Psíquico.</p>
