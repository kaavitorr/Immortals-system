name: Ilusionista
type: archetype
folder: 26a0e683ac977c63
system:
  description:
    value: >-
      <p>Confunde a percepção inimiga com imagens falsas, disfarces e duplicatas. Usa essa distração para atacar de
      outra posição ou escapar quando é localizada.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Físicos −8</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 + Sab).</p><p><strong>Perícias:</strong> Proficiências:
      Enganação, Sobrenatural, Furtividade e Atuação.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Mimetismo, Camuflagem, Algoz Invisível, Analisar Padrões, Mente
      Singular, Silenciosa, Hipnose Passiva, Sussurro Perturbador, Reflexos Aguçados,
      Descuidado.</p><p><strong>Habilidades:</strong> Ilusão Menor, Criar Duplicata, Passo das Sombras, Fingir-se de
      Objeto, Imitar Voz, Trocar de Forma, Jato de Tinta, Esquiva Rápida, Medo Instilado, Onda de
      Charme.</p><p><strong>Reações:</strong> Duplicata Reativa, Ilusão Reativa, Esquiva Rápida.</p>
