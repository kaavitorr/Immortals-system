name: Perseguidor
type: archetype
folder: 29e85c5a0e7a7147
system:
  description:
    value: >-
      <p>Marca a presa e mantém uma perseguição constante, reduzindo suas oportunidades de fuga. Usa deslocamentos
      súbitos e ataques reativos para continuar ao seu alcance.</p><p><strong>Resistência por ND:</strong> Psíquico
      +2</p><p><strong>Vulnerabilidade:</strong> Físicos −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até
      um máximo de 25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 + Sab).</p><p><strong>Perícias:</strong>
      Proficiências: Percepção, Furtividade, Sobrevivência e Intimidação.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Reflexo e Vontade.</p><p><strong>Aspectos:</strong> Implacável, Fanático, Aura do Medo, Silenciosa,
      Mente Singular, Criatura sem Alma, Algoz Invisível, Reflexos Aguçados, Analisar Padrões, Sussurro
      Perturbador.</p><p><strong>Habilidades:</strong> Perseguição Sem Fim, Marca do Culpado, Passo das Sombras, Bote
      Sônico, Medo Instilado, Golpe Letal, Surto de Velocidade, Esquiva Rápida, Grito Psíquico, Fuga
      Escorregadia.</p><p><strong>Reações:</strong> Perseguição Implacável, Contra-Golpe, Esquiva Rápida.</p>
