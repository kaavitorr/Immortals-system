  description:
    value: >-
      <p><strong>Ações: ⬢⬢⬢⬢ / rodada</strong></p><p>Ao gastar 10 PQ por rodada, a criatura carrega o ar com
      eletricidade, formando uma nuvem que libera uma chuva de raios de forma constante no campo de batalha. No início
      de cada um dos turnos dela, pode escolher um local a até 30 metros das nuvens para liberar a eletricidade, que
      atinge uma área de 5 metros de raio. Todas as criaturas dentro da área devem realizar uma Salvaguarda de Reflexo,
      sofrendo 8d6 de dano Elétrico se falharem ou metade se obtiverem sucesso. O dano aumenta em +1 dado para cada 4
      NDs da criatura.</p>
