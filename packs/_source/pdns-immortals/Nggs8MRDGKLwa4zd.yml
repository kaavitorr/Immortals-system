name: Colônia
type: archetype
folder: dcb7bdd3e7181c6f
system:
  description:
    value: >-
      <p>Atua como um conjunto de organismos ligados entre si. Usa esporos, fios e ataques coordenados para dominar a
      área, recompondo partes danificadas do corpo.</p><p><strong>Resistência por ND:</strong> Veneno +2 | Ácido
      +1</p><p><strong>Vulnerabilidade:</strong> Fogo −6 | Cortante −6 · Mov +1 |
      5/ND</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong>
      Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Sobrenatural, Percepção, Sobrevivência e
      Medicina.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Mente Singular, Corpo Inerte, Autossuficiente, Implacável, Mente
      Inexistente, Absorção Rápida, Regeneração Lenta, Temperamento Frio, Um Com o Mundo, Morte
      Falsa.</p><p><strong>Habilidades:</strong> Nuvem de Esporos, Divisão, Regenerar Membro, Armadilha de Pólen,
      Chicote de Hifas, Transferir Praga, Medo Instilado, Controle Natural, Enrolar, Ataque em
      Cadeia.</p><p><strong>Reações:</strong> Esporos Reativos, Reformar Colônia, Ataque em Cadeia.</p>
