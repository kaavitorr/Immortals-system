system:
  description:
    value: >-
      <p>Lidera o bando pela força e pela intimidação. Combina golpes pesados com ordens e rugidos que coordenam os
      aliados e abalam a resistência inimiga.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −8</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Couro Pesado (10 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Intimidação, Percepção, Sobrevivência e Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Reflexo.</p><p><strong>Aspectos:</strong> Presença Aterradora, Intimidadora, Tática de Bando, Aura do Medo,
      Fanático, Implacável, Força Descomunal, Analisar Padrões, Vigoroso, Ferimento
      Enfurecedor.</p><p><strong>Habilidades:</strong> Rugido Terrível, Grito de Guerra, Ordem Tática, Marca do Culpado,
      Investida Derrubadora, Golpe Aterrador, Terremoto, Onda de Choque, Contra-Golpe, Execução
      Guardiã.</p><p><strong>Reações:</strong> Rugido Reativo, Ordem Reativa, Ataque Reativo.</p>
