  description:
    value: >-
      <p><strong>Ações:</strong> ⬢⬢⬢</p><p>Durante seu deslocamento aéreo, a criatura deixa um rastro de brasas que
      permanece por um breve período. Ao usar 3 Ponto de Ação [⬢⬢⬢] e até 30 PQ. Essa criatura avança em linha reta pelo
      seu deslocamento disponível, empurrando todas as criaturas na linha 1 metro para os lados e deixando um rastro de
      chamas de 3 metros de largura. Todas as criaturas dentro da área devem realizar uma Salvaguarda de Reflexo.
      Sofrendo 1d6 de dano de Fogo por PQ gasto se falharem ou metade se obtiverem sucesso. Não é possível gastar um
      valor de PQ maior que o ND/Nível da criatura.</p>
