system:
  description:
    value: >-
      <p>Mantém a postura e observa o adversário antes de executar cortes precisos. Combina técnicas de saque,
      contragolpes e defesa firme para decidir o confronto.</p><p><strong>Resistência por ND:</strong> Cortante
      +2</p><p><strong>Vulnerabilidade:</strong> Psíquico −6</p><p><strong>Deslocamento:</strong> Caminhada: 10 m
      (fixo)</p><p><strong>Armaduras:</strong> Placas Leves (12 + For).</p><p><strong>Perícias:</strong> Proficiências:
      Atletismo, Percepção, Coordenação e Intimidação.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Reflexo.</p><p><strong>Aspectos:</strong> Golpe Preciso, Implacável, Temperamento Frio, Fanático, Reativo,
      Presença Aterradora, Vigoroso, Analisar Padrões, Corpo Resistente,
      Intimidadora.</p><p><strong>Habilidades:</strong> Golpe Letal, Contra-Golpe, Golpe Duplo, Desarme, Manter Firme,
      Execução Guardiã, Investida Derrubadora, Esquiva Rápida, Ordem Tática, Impacto
      Atordoante.</p><p><strong>Reações:</strong> Corte de Iai, Contra-Golpe, Postura Defensiva.</p>
