      +2</p><p><strong>Vulnerabilidade:</strong> Fogo – 6 | Frio -6 | Elétrico -6</p><p><strong>Deslocamento:</strong>
      +1 até um máximo de 25</p><p><strong>Armaduras:</strong> Pele Fina (6 + Agi).</p><p><strong>Perícias:</strong>
      Proficiências: Atletismo, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude
      e Vontade.</p><p><strong>Aspectos:</strong> Sentidos Aguçados, Corpo Inerte,
      Implacável.</p><p><strong>Habilidades:</strong> Força Aprimorada, Manter Firme, Força
      Imparável</p><p><strong>Reações:</strong> Endurecer.</p>
