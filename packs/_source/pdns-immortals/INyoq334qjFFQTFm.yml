system:
  description:
    value: >-
      <p>Combina voo e ataques físicos com gritos que perturbam os inimigos. Usa a ecolocalização para localizar a presa
      e responde à aproximação com ecos e esquivas.</p><p><strong>Resistência por ND:</strong> Psíquico +1 | Elétrico
      +1</p><p><strong>Vulnerabilidade:</strong> Contundente −6 | Cortante −6 · Mov +1 |
      5/ND</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong>
      Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Percepção, Intimidação, Sobrenatural e
      Furtividade.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Ecolocalização, Audição Aguçada, Voo Superior, Sobrevoo, Visão no
      Escuro, Agarrador, Reflexos Aguçados, Tática de Bando, Silenciosa, Sede de
      Sangue.</p><p><strong>Habilidades:</strong> Grito Estridente, Grito Psíquico, Onda de Choque, Ataque de Mergulho,
      Drenagem de Sangue, Nuvem de Morcegos, Mordida Voraz, Esquiva Rápida, Ressonância.</p><p><strong>Reações:</strong>
      Grito Reativo, Eco Desorientador, Esquiva Rápida.</p>
