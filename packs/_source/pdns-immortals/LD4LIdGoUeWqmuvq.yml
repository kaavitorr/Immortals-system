system:
  description:
    value: >-
      <p>Rompe formações com investidas, atropelamentos e golpes do próprio corpo. Atua com ou sem cavaleiro e reage com
      coices e contragolpes a quem se aproxima.</p><p><strong>Resistência por ND:</strong> Contundente
      +2</p><p><strong>Vulnerabilidade:</strong> Fogo −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Musculatura Densa (10 + Con).</p><p><strong>Perícias:</strong>
      Proficiências: Atletismo, Intimidação, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Fortitude e Reflexo.</p><p><strong>Aspectos:</strong> Força Descomunal, Vigoroso, Corpo Robusto,
      Agressivo, Implacável, Estabilidade, Ferimento Enfurecedor, Fanático, Descuidado,
      Reativo.</p><p><strong>Habilidades:</strong> Investida, Investida Derrubadora, Golpe Esmagador, Debandada, Onda de
      Choque, Impacto Atordoante, Grito de Guerra, Manter Firme, Contra-Golpe, Enrijecer
      Músculos.</p><p><strong>Reações:</strong> Coice Reativo, Atropelo Reativo, Contra-Golpe.</p>
