system:
  description:
    value: >-
      <p><strong>Ações:</strong> ⬢⬢⬢</p><p>A criatura dispersa parte de suas chamas em uma explosão de cinzas e brasas,
      dificultando a visão de quem está próximo. Ao usar 3 Pontos de Ação [⬢⬢⬢] e até 30 PQ, a criatura pode liberar uma
      explosão de chamas em uma área de 10 metros de emanação +1 metro por ND dela. Todas as criaturas no interior devem
      realizar uma Salvaguarda de Reflexo. Sofrendo 1d6 de dano de Fogo por PQ se falharem ou metade se obtiverem
      sucesso. Não é possível gastar um valor de PQ maior que o ND/Nível da criatura.</p>
