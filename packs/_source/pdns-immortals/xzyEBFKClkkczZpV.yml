system:
  description:
    value: >-
      <p>Luta em conjunto com a colmeia, formando massas de ataque e defesa. Usa investidas, fios e armadilhas para
      proteger o ninho e abrir caminho para o grupo.</p><p><strong>Resistência por ND:</strong> Contundente +1 | Veneno
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6 | Fogo −6 · Mov +1 |
      5/ND</p><p><strong>Deslocamento:</strong> +1 até um máximo de 25</p><p><strong>Armaduras:</strong>
      Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Atletismo, Percepção, Sobrevivência e
      Coordenação.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Mente Singular, Tática de Bando, Implacável, Vigoroso,
      Autossuficiente, Fanático, Corpo Inerte, Pele Grossa, Caminhante de Superfícies, Morte
      Falsa.</p><p><strong>Habilidades:</strong> Investida, Golpe Duplo, Disparo de Teia, Tecer Acelerado, Armadilha de
      Pólen, Cuspir Veneno, Debandada, Digestão Rápida, Ataque em Cadeia, Regenerar
      Membro.</p><p><strong>Reações:</strong> Investida Reativa, Defesa de Colmeia, Alerta.</p>
