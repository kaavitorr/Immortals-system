  description:
    value: >-
      <p>Ataca de perto com várias cabeças, combinando mordidas e golpes da cauda. Regenera partes feridas para manter a
      pressão durante confrontos prolongados.</p><p><strong>Resistência por ND:</strong> Perfurante
      +2</p><p><strong>Vulnerabilidade:</strong> Fogo −10 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências: Atletismo,
      Intimidação, Percepção e Sobrevivência.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Regeneração Lenta, Corpo Inerte, Morte Falsa, Implacável, Mente
      Inexistente, Vigoroso, Fanático, Corpo Robusto, Ferimento Enfurecedor,
      Descuidado.</p><p><strong>Habilidades:</strong> Divisão, Regenerar Membro, Mordida Voraz, Golpe de Cauda, Golpe
      Duplo, Ataque em Cadeia, Enrolar, Terremoto, Onda de Choque, Contra-Golpe.</p><p><strong>Reações:</strong> Cabeça
      Reativa, Mordida Reativa, Regeneração Reativa.</p>
