system:
  description:
    value: >-
      <p>Abre túneis e ataca debaixo da terra, surgindo sob a presa. Usa o subsolo para mudar de posição, surpreender o
      inimigo e escapar de represálias.</p><p><strong>Resistência por ND:</strong> Contundente
      +2</p><p><strong>Vulnerabilidade:</strong> Ácido −6</p><p><strong>Deslocamento:</strong> +1 até um máximo de
      25</p><p><strong>Armaduras:</strong> Pele Grossa (10 + Con).</p><p><strong>Perícias:</strong> Proficiências:
      Percepção, Sobrevivência, Furtividade e Atletismo.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Escavador, Tremoresense, Emboscador, Ataque Surpresa, Visão no Escuro,
      Corpo Inerte, Pele Grossa, Silenciosa, Vigoroso, Implacável.</p><p><strong>Habilidades:</strong> Investida
      Subterrânea, Emersão Explosiva, Imersão de Fuga, Bote Letal, Terremoto, Golpe de Cauda, Lançar Rocha, Enrijecer
      Músculos, Esquiva Rápida, Investida Derrubadora.</p><p><strong>Reações:</strong> Emboscada Reativa, Ataque
      Reativo, Imersão de Fuga.</p>
