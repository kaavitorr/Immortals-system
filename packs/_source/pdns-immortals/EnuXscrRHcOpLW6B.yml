system:
  description:
    value: >-
      <p>Separa e recompõe partes do corpo durante a luta. Ataca por meio dos fragmentos e regenera membros para manter
      a pressão mesmo após sofrer ferimentos.</p><p><strong>Resistência por ND:</strong> Perfurante
      +2</p><p><strong>Vulnerabilidade:</strong> Contundente −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1
      até um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Sobrevivência, Percepção, Atletismo e Sobrenatural.</p><p><strong>Salvaguardas:</strong> Proficiências: Vontade e
      Fortitude.</p><p><strong>Aspectos:</strong> Regeneração Lenta, Corpo Inerte, Absorção Rápida, Implacável, Mente
      Inexistente, Pele Grossa, Vigoroso, Fanático, Estabilidade, Morte Falsa.</p><p><strong>Habilidades:</strong>
      Divisão, Regenerar Membro, Chuva de Espinhos, Estilhaçar, Abraço Esmagador, Digestão Rápida, Bote Sônico,
      Contra-Golpe, Manter Firme, Ataque em Cadeia.</p><p><strong>Reações:</strong> Divisão Reativa, Estilhaço Reativo,
      Regeneração Reativa.</p>
