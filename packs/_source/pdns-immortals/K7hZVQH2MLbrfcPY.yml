system:
  description:
    value: >-
      <p>Enfrenta o inimigo de forma direta, alternando ataques, defesa e manobras com armas. Combina investidas e
      golpes coordenados para sustentar a linha de frente.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Psíquico −6</p><p><strong>Deslocamento:</strong> Caminhada: 10 m
      (fixo)</p><p><strong>Armaduras:</strong> Couro Pesado (10 + Agi).</p><p><strong>Perícias:</strong> Proficiências:
      Atletismo, Intimidação, Percepção e Coordenação.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Corpo Resistente, Vigoroso, Reativo, Fanático, Agressivo, Golpe Preciso,
      Tática de Bando, Implacável, Corpo Robusto, Descuidado.</p><p><strong>Habilidades:</strong> Golpe Duplo,
      Contra-Golpe, Golpe Esmagador, Investida, Desarme, Grito de Guerra, Manter Firme, Ordem Tática, Ataque em Cadeia,
      Impacto Atordoante.</p><p><strong>Reações:</strong> Contra-Golpe, Ataque Reativo, Postura Defensiva.</p>
