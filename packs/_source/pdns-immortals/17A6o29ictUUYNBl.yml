name: Frenético (berserker)
type: archetype
folder: 26a0e683ac977c63
system:
  description:
    value: >-
      <p>Avança de forma agressiva e troca proteção por ataques incessantes. Explora a fúria e os próprios ferimentos
      para pressionar o inimigo com golpes e contra-ataques.</p><p><strong>Resistência por ND:</strong> Físicos +1 |
      Psíquico +1</p><p><strong>Vulnerabilidade:</strong> Veneno −6 | Ácido −6</p><p><strong>Deslocamento:</strong> +1
      até um máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Atletismo, Intimidação, Sobrevivência e Percepção.</p><p><strong>Salvaguardas:</strong> Proficiências: Fortitude e
      Vontade.</p><p><strong>Aspectos:</strong> Fúria, Ferimento Enfurecedor, Frenesi de Sangue, Agressivo, Descuidado,
      Fanático, Implacável, Corpo Resistente, Sede de Sangue, Reflexos Aguçados.</p><p><strong>Habilidades:</strong>
      Golpe Duplo, Investida, Golpe Esmagador, Impacto Atordoante, Grito de Guerra, Contra-Golpe, Bote Sônico, Golpe
      Giratório, Carnívoro Voraz, Ataque em Cadeia.</p><p><strong>Reações:</strong> Contra-Golpe, Fúria Reativa,
      Reflexo.</p>
