system:
  description:
    value: >-
      <p>Combate a curta distância com socos, agarrões e projeções. Usa o corpo inteiro para desequilibrar, desarmar e
      controlar os movimentos do oponente.</p><p><strong>Resistência por ND:</strong> Contundente +2 (corpo trincado de
      apanar)</p><p><strong>Vulnerabilidade:</strong> Cortante −6</p><p><strong>Deslocamento:</strong> Caminhada: 10 m
      (fixo)</p><p><strong>Armaduras:</strong> Musculatura Densa (10 + Con).</p><p><strong>Perícias:</strong>
      Proficiências: Atletismo, Intimidação, Percepção e Coordenação.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Fortitude e Vontade.</p><p><strong>Aspectos:</strong> Força Descomunal, Vigoroso, Corpo Resistente,
      Agarrador, Implacável, Fanático, Descuidado, Reativo, Reflexos Aguçados, Analisar
      Padrões.</p><p><strong>Habilidades:</strong> Golpe Esmagador, Enrolar, Abraço Esmagador, Desarme, Contra-Golpe,
      Golpe Duplo, Impacto Atordoante, Enrijecer Músculos, Investida Derrubadora, Golpe
      Giratório.</p><p><strong>Reações:</strong> Agarrão Reativo, Contra-Golpe, Enrijecer Músculos.</p>
