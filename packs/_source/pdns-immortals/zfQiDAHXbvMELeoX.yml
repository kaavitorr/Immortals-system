system:
  description:
    value: >-
      <p>Explora o terreno e os objetos ao redor para surpreender e desarmar o inimigo. Usa disfarces e fugas rápidas
      para retomar a ofensiva de outra posição.</p><p><strong>Resistência por ND:</strong> Físicos
      +1</p><p><strong>Vulnerabilidade:</strong> Alma −6 · Mov +1 | 5/ND</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Nenhuma.</p><p><strong>Perícias:</strong> Proficiências:
      Furtividade, Enganação, Investigação e Sorte.</p><p><strong>Salvaguardas:</strong> Proficiências: Reflexo e
      Vontade.</p><p><strong>Aspectos:</strong> Analisar Padrões, Silenciosa, Reflexos Aguçados, Camuflagem, Tática de
      Bando, Descuidado, Faro Aguçado, Audição Aguçada, Algoz Invisível, Fanático.</p><p><strong>Habilidades:</strong>
      Desarme, Roubo de Nome, Apunhalar, Ilusão Menor, Esquiva Rápida, Fuga Escorregadia, Passo das Sombras, Ordem
      Tática, Imitar Voz, Tiro Preciso.</p><p><strong>Reações:</strong> Desarme Reativo, Fuga Escorregadia, Reflexo.</p>
