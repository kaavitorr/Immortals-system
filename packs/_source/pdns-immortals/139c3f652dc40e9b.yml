system:
  description:
    value: >-
      <p>Toda vez que essa criatura realizar um ataque de mordida contra outra criatura, o dano é causado tanto nos
      Pontos de Vida quanto nos Pontos de Ferida do alvo. Quando os Pontos de Ferida acumularem 1/4 do valor total, o
      alvo é infectado, fazendo seu corpo se deformar lentamente e aumentando os custos de suas técnicas em +1 PQ. Ao
      acumular metade do valor de Feridas por meio das mordidas, ele se torna completamente infectado, transformando-se
      em uma maldição e em um lacaio do Necrófago.</p>
    chat: ''
