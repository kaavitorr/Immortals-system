system:
  description:
    value: >-
      <p>Desgasta a vítima com sangramentos, medo e dor persistente. Usa esses efeitos para limitar suas reações e
      manter o controle do confronto.</p><p><strong>Resistência por ND:</strong> Psíquico +2 | Alma
      +1</p><p><strong>Vulnerabilidade:</strong> Físicos −10 | Veneno −6</p><p><strong>Deslocamento:</strong> +1 até um
      máximo de 25</p><p><strong>Armaduras:</strong> Armadura Psíquica (8 + Sab).</p><p><strong>Perícias:</strong>
      Proficiências: Intimidação, Enganação, Sobrenatural e Medicina.</p><p><strong>Salvaguardas:</strong>
      Proficiências: Presença e Fortitude.</p><p><strong>Aspectos:</strong> Sede de Sangue, Presença Aterradora, Aura do
      Medo, Fanático, Analisar Padrões, Implacável, Descuidado, Intimidadora, Sussurro Perturbador, Mente
      Inexistente.</p><p><strong>Habilidades:</strong> Medo Instilado, Golpe Preciso, Marca do Culpado, Corte Sangrento,
      Beijo Tenebroso, Grito Psíquico, Dreno da Alma, Impacto Atordoante, Mordida Voraz, Transferir
      Praga.</p><p><strong>Reações:</strong> Corte Reativo, Contra-Golpe, Sussurro Reativo.</p>
