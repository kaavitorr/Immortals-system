      +5.</p><p><strong>Vulnerabilidade:</strong> Contundente −5.</p><p><strong>Deslocamento:</strong> Caminhada 12
      m.</p><p><strong>Armaduras:</strong> Couro Leve (6 + Agilidade).</p><p><strong>Perícias:</strong> Enganação,
      Furtividade, Percepção e Atuação.</p><p><strong>Salvaguardas:</strong> Vontade e
      Reflexo.</p><p><strong>Aspectos:</strong> Longevidade das Mil Eras, Faro Aguçado, Silenciosa, Beleza
      Sobrenatural.</p><p><strong>Habilidades:</strong> Miragem Instintiva.</p><p><strong>Ataques comuns:</strong>
