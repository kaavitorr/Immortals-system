    value: <p><strong>Elemento:</strong> Fogo · <strong>Nível:</strong> 3 · <strong>Categoria:</strong> Parte de animal</p><p>O leopardo em Chama envolve as patas em Qi ardente antes de saltar, deixando rastros luminosos que desaparecem sem incendiar a vegetação. Seus tendões fornecem afinidade de Fogo e elasticidade às matrizes de movimento, unindo impulso térmico e continuidade em preparados para o corpo.</p><p data-iw-material-unit="2"><strong>Unidade comercial:</strong> um exemplar ou uma amostra de qualidade, com Qi preservado, pronta para uso na receita. O preço corresponde a uma unidade aproveitável do ingrediente.</p>
