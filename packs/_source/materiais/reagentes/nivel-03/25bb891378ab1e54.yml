    value: <p><strong>Nível:</strong> 3 · <strong>Categoria:</strong> Reagente · <strong>Função:</strong> Estabilizante</p><p>Vinhas espirituais que crescem sobre antigas formações abandonadas produzem uma goma azul acinzentada, atravessada por filamentos elásticos de Qi. Apurada, mantém os componentes próximos enquanto o artesão ajusta a mistura. É usada como estabilizante em massas alquímicas, pigmentos e junções de matrizes, preservando a afinidade dos ingredientes ativos.</p><p data-iw-material-unit="2"><strong>Unidade comercial:</strong> um exemplar ou uma amostra de qualidade, com Qi preservado, pronta para uso na receita. O preço corresponde a uma unidade aproveitável do ingrediente.</p>
