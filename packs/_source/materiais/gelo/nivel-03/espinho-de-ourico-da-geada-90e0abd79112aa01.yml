    value: <p><strong>Elemento:</strong> Gelo · <strong>Nível:</strong> 3 · <strong>Categoria:</strong> Parte de animal</p><p>O ouriço da geada dorme sobre rochas que recebem Qi frio das estrelas de inverno. Seus espinhos crescem ocos, contendo filamentos cristalinos; o alquimista os aproveita para introduzir essência gelada em pequenas correntes bem separadas, evitando condensações abruptas.</p><p data-iw-material-unit="2"><strong>Unidade comercial:</strong> um exemplar ou uma amostra de qualidade, com Qi preservado, pronta para uso na receita. O preço corresponde a uma unidade aproveitável do ingrediente.</p>
