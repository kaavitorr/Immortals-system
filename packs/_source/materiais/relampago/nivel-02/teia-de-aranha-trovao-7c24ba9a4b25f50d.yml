    value: <p><strong>Elemento:</strong> Relâmpago · <strong>Nível:</strong> 2 · <strong>Categoria:</strong> Parte de animal</p><p>A aranha-trovão estende suas redes entre rochas onde o Qi elétrico salta durante as tempestades. Os fios conduzem a descarga enquanto os nós a retêm, permitindo formar caminhos ramificados de essência fulmínea dentro de pastas sem concentrar toda a carga no centro.</p><p data-iw-material-unit="2"><strong>Unidade comercial:</strong> um exemplar ou uma amostra de qualidade, com Qi preservado, pronta para uso na receita. O preço corresponde a uma unidade aproveitável do ingrediente.</p>
