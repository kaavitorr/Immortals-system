  description:
    value: >-
      <p>Uma pequena moeda de latão com um rosto largo e sorridente e pequenos olhos de granada vermelha. A moeda é
      carimbada com uma sequência específica de sigilos que a vinculam a uma moeda irmã, permitindo que os dois
      portadores se comuniquem a grandes distâncias.</p><p>Se você segurar a moeda e falar com ela, ela conecta
      imediatamente sua irmã e começa a falar alto, transmitindo o que você diz e o que é respondido. A conexão dura até
      1 minuto antes de ser interrompida. Cada moeda pode ser usada uma vez por descanso longo.</p><p>A moeda pode ser
      usada 5 vezes, após as quais sua mágica se desvanece, tornando-a quase sem valor.</p>
